<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunny time</title>
<meta name="description" content="Các bước xử lý tại nhà khi bé hoặc mẹ gặp vấn đề sau sinh: trớ sữa, sốt, vàng da, tắc tia sữa và các dấu hiệu phải đi cấp cứu.">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunny time">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem("xltn-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
/* ============================================================
   Sunny time. Nền kem ấm, màu thương hiệu xanh mực.
   Ba màu mức độ (xanh lá, hổ phách, đỏ) chỉ dùng cho mức độ,
   không dùng để trang trí, để lúc hoảng vẫn đọc ra ngay.
   ============================================================ */
:root{
  --ground:#F7F4EE; --surface:#FFFFFF; --surface-2:#EFEAE1; --surface-3:#E6DFD3;
  --ink:#1D2530; --ink-2:#3F4A57; --ink-3:#6B7480; --ink-mute:#9AA1A9;
  --line:#E3DCD0; --line-2:#EFE9DF;
  --brand:#1F3A5F; --brand-2:#36587F; --brand-wash:#E7EDF4; --on-brand:#FFFFFF;
  --coral:#E0674F;
  --green:#2E7D57; --green-wash:#E5F2EA; --green-ink:#21603F;
  --yellow:#B26B12; --yellow-wash:#FBEFD9; --yellow-ink:#8A520A;
  --red:#C2362B; --red-wash:#FBE6E3; --red-ink:#9E2A21; --on-red:#FFFFFF;
  --shadow:0 1px 2px rgba(29,37,48,.05), 0 10px 28px -16px rgba(29,37,48,.28);
  --r-card:20px; --r-m:14px; --r-s:10px; --r-pill:999px;
  --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --top-h:56px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#11161D; --surface:#19202A; --surface-2:#212A36; --surface-3:#2A3442;
    --ink:#EDEAE4; --ink-2:#C9CDD3; --ink-3:#98A0AB; --ink-mute:#6C7581;
    --line:#2B3542; --line-2:#222B37;
    --brand:#8FB3DA; --brand-2:#A9C6E6; --brand-wash:#1E2C3D; --on-brand:#0F1722;
    --coral:#F08A74;
    --green:#5BBE8A; --green-wash:#16291F; --green-ink:#86D3A8;
    --yellow:#E5A54B; --yellow-wash:#2D2414; --yellow-ink:#F0C27F;
    --red:#F0705F; --red-wash:#341B19; --red-ink:#F7A296; --on-red:#1A0B09;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#11161D; --surface:#19202A; --surface-2:#212A36; --surface-3:#2A3442;
  --ink:#EDEAE4; --ink-2:#C9CDD3; --ink-3:#98A0AB; --ink-mute:#6C7581;
  --line:#2B3542; --line-2:#222B37;
  --brand:#8FB3DA; --brand-2:#A9C6E6; --brand-wash:#1E2C3D; --on-brand:#0F1722;
  --coral:#F08A74;
  --green:#5BBE8A; --green-wash:#16291F; --green-ink:#86D3A8;
  --yellow:#E5A54B; --yellow-wash:#2D2414; --yellow-ink:#F0C27F;
  --red:#F0705F; --red-wash:#341B19; --red-ink:#F7A296; --on-red:#1A0B09;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:inherit}
strong{font-weight:700}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px;border-radius:6px}

/* ---------- thanh trên ---------- */
.top{position:sticky;top:0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 8px 0;display:flex;align-items:center;gap:4px;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-back,.theme-btn{width:44px;height:44px;border:0;background:none;border-radius:12px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.top-back:active,.theme-btn:active{background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:0 8px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;flex:none;display:block}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.top-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.top.show-title .top-title{opacity:1}
.top.inner .brand{display:none}
.top:not(.inner) .top-title{display:none}
.top:not(.inner) .brand{flex:1}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .i-sun{display:block}
  :root:not([data-theme="light"]) .theme-btn .i-moon{display:none}
}

/* ---------- khung nội dung ---------- */
main{display:block;outline:none;max-width:640px;margin:0 auto;
  padding:8px 16px calc(var(--tab-h) + var(--safe-b) + 32px)}
.page-enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page-enter{animation:none}}

h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px;font-weight:800}
h2{font-size:20px;line-height:1.3;margin:0;font-weight:800;letter-spacing:-.01em}
.lede{color:var(--ink-3);margin:0 0 18px;font-size:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 10px}

/* ---------- tìm kiếm ---------- */
.search{position:relative;margin:4px 0 22px}
.search input{width:100%;height:56px;border-radius:16px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:18px;padding:0 48px 0 50px;
  box-shadow:var(--shadow);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-mute)}
.search input:focus{outline:none;border-color:var(--brand-2)}
.search .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .s-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border:0;background:none;border-radius:12px;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.search-empty{padding:28px 8px;text-align:center;color:var(--ink-3)}
.search-empty strong{color:var(--ink)}

/* ---------- lưới nhóm ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;gap:10px;padding:16px;min-height:112px;border-radius:var(--r-card);
  background:var(--surface);text-decoration:none;box-shadow:var(--shadow);border:1px solid var(--line-2);
  transition:transform .12s}
.cat:active{transform:scale(.98)}
.cat-icon{font-size:28px;line-height:1}
.cat-title{font-weight:700;font-size:16px;line-height:1.3}
.cat-count{font-size:13px;color:var(--ink-3);margin-top:auto}
.cat.me{background:var(--brand-wash);border-color:transparent}

/* ---------- danh sách tình huống ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-card);
  box-shadow:var(--shadow);border:1px solid var(--line-2);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:64px;text-decoration:none;
  border-top:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-bottom:0;
  width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:17px;line-height:1.3}
.row-sub{font-size:14px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-sub mark{background:var(--yellow-wash);color:inherit;border-radius:3px;padding:0 1px}
.chev{color:var(--ink-mute);flex:none}
.dots{display:flex;gap:4px;flex:none;width:32px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.red{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-3);margin:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k-badge{flex:none;width:36px;height:36px;border-radius:10px;background:var(--brand-wash);color:var(--brand);
  font-weight:800;font-size:14px;display:grid;place-items:center}

/* ---------- kỹ năng dạng chip ngang ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:15px;
  white-space:nowrap;cursor:pointer}
.chip:active{background:var(--surface-2)}

/* ---------- thẻ cài app ---------- */
.install{margin-top:28px;padding:16px;border-radius:var(--r-card);border:1.5px dashed var(--line);
  display:flex;gap:14px;align-items:flex-start}
.install-icon{flex:none;width:44px;height:44px;border-radius:11px;display:block}
.install p{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.install .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;
  text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-3)}
.btn.danger{background:var(--red);color:var(--on-red);border-color:transparent}
.btn.big{min-height:60px;font-size:19px;border-radius:16px;width:100%}

/* ---------- trang tình huống ---------- */
.sit-head{margin:4px 0 18px}
.sev{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);
  font-size:14px;font-weight:700}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-wash);color:var(--green-ink)}
.pill.yellow{background:var(--yellow-wash);color:var(--yellow-ink)}
.pill.red{background:var(--red-wash);color:var(--red-ink)}
.sev-note{font-size:14px;color:var(--ink-3);margin:8px 0 0}

.alert{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-m);
  background:var(--red-wash);color:var(--red-ink);margin:0 0 18px;text-decoration:none;font-weight:600;font-size:15px}
.alert svg{flex:none}

.block{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);
  border:1px solid var(--line-2);margin:0 0 14px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.block-head h2{flex:1;font-size:18px}
.progress{font-size:14px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.progress.done{color:var(--green)}
.reset{border:0;background:none;color:var(--brand-2);font-weight:700;font-size:14px;cursor:pointer;
  min-height:36px;padding:0 6px;border-radius:8px}
.since{font-size:13px;color:var(--ink-3);padding:0 16px 4px}

/* bước có thể đánh dấu */
.steps{list-style:none;margin:0;padding:4px 0 8px}
.step{display:flex;gap:14px;padding:12px 16px;cursor:pointer;align-items:flex-start;
  -webkit-user-select:none;user-select:none;transition:background .12s}
.step:active{background:var(--surface-2)}
.step-n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink-2);margin-top:-3px;
  transition:background .15s,border-color .15s,color .15s}
.step-n svg{display:none}
.step-body{flex:1;min-width:0}
.step-text{line-height:1.5}
.step.done .step-n{background:var(--green);border-color:var(--green);color:#fff}
.step.done .step-n span{display:none}
.step.done .step-n svg{display:block}
.step.done .step-text{color:var(--ink-3)}
.sub{margin:8px 0 0;padding:0 0 0 2px;list-style:none;font-size:16px;color:var(--ink-2)}
.sub li{position:relative;padding-left:18px;margin:5px 0}
.sub li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink-mute)}
.sub.ol{counter-reset:s}
.sub.ol li{padding-left:26px}
.sub.ol li::before{counter-increment:s;content:counter(s) ".";background:none;width:auto;height:auto;
  top:0;left:0;font-weight:700;color:var(--ink-3);font-size:15px}
.step.done .sub{color:var(--ink-3)}

/* các phần gập lại */
details.block>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;min-height:56px}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary h2{flex:1;font-size:18px}
details.block>summary .tw{color:var(--ink-mute);transition:transform .2s}
details.block[open]>summary .tw{transform:rotate(90deg)}
.k-ico{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.k-ico svg{width:16px;height:16px}
.k-prevent .k-ico{background:var(--brand-wash);color:var(--brand)}
.k-avoid .k-ico{background:var(--yellow-wash);color:var(--yellow-ink)}
.k-doctor .k-ico{background:var(--red-wash);color:var(--red-ink)}
.k-info .k-ico{background:var(--surface-2);color:var(--ink-2)}
.k-doctor{border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.k-doctor>summary h2{color:var(--red-ink)}
.blist{list-style:none;margin:0;padding:0 16px 14px}
.blist li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--line-2)}
.blist li:first-child{border-top:0}
.blist li::before{content:"";position:absolute;left:4px;top:1.05em;width:7px;height:7px;border-radius:50%;background:var(--ink-mute)}
.k-doctor .blist li::before{background:var(--red)}
.k-avoid .blist li::before{background:var(--yellow)}
.k-prevent .blist li::before{background:var(--brand-2)}
.ptext{margin:0;padding:0 16px 16px;color:var(--ink-2)}
.block .call{margin:0 16px 16px;width:calc(100% - 32px)}
.note{display:flex;gap:10px;padding:14px 16px;border-radius:var(--r-m);background:var(--brand-wash);
  color:var(--ink-2);font-size:15px;margin:0 0 14px}

/* chip trỏ sang kỹ năng / tình huống khác */
.ref{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--brand-wash);color:var(--brand);
  font-weight:700;font-size:.9em;padding:2px 10px;border-radius:var(--r-pill);cursor:pointer;
  line-height:1.6;vertical-align:baseline;text-decoration:none;white-space:nowrap}
.ref::after{content:"›";font-weight:800}

.disclaimer{font-size:13px;color:var(--ink-3);margin:20px 4px 0;line-height:1.5}

/* ---------- trang cấp cứu ---------- */
.sos-hero{background:var(--red);color:var(--on-red);border-radius:var(--r-card);padding:20px;margin:4px 0 14px}
.sos-hero h1{margin:0 0 4px;font-size:26px}
.sos-hero p{margin:0 0 16px;opacity:.92;font-size:15px}
.sos-call{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;border-radius:16px;
  background:var(--on-red);color:var(--red);font-weight:800;font-size:22px;text-decoration:none}
.sos-call:active{transform:scale(.98)}
.sos-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.sos-quick a{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r-m);background:var(--surface);
  border:1px solid var(--line-2);box-shadow:var(--shadow);text-decoration:none;font-weight:700;font-size:15px;line-height:1.3}
.sos-quick small{font-weight:500;color:var(--ink-3);font-size:13px}

/* ---------- công cụ ---------- */
.tool{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);border:1px solid var(--line-2);
  padding:18px 16px;margin:0 0 14px}
.tool h2{margin-bottom:4px}
.tool p{margin:0 0 14px;color:var(--ink-3);font-size:15px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;
  color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tap{width:100%;min-height:220px;border-radius:20px;border:0;background:var(--brand);color:var(--on-brand);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .06s}
.tap:active{transform:scale(.985)}
.tap .big{font-size:72px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tap .small{font-size:15px;font-weight:600;opacity:.85}
.tap.idle{background:var(--surface-2);color:var(--ink)}
.timer-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:12px 0 4px}
.timer-bar i{display:block;height:100%;background:var(--brand-2);width:0;transition:width .25s linear}
.timer-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.verdict{border-radius:var(--r-m);padding:14px 16px;margin-top:14px;font-size:15px}
.verdict strong{display:block;font-size:18px;margin-bottom:2px}
.verdict.ok{background:var(--green-wash);color:var(--green-ink)}
.verdict.bad{background:var(--red-wash);color:var(--red-ink)}
.countdown{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 10px;letter-spacing:-.02em}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}
.ring{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{background:var(--red);color:var(--on-red)}}

/* ---------- thanh dưới ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  height:calc(var(--tab-h) + var(--safe-b));padding:0 6px var(--safe-b);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:600;border-radius:12px;margin:6px 2px}
.tabs svg{width:24px;height:24px}
.tabs a.on{color:var(--brand)}
.tabs a.tab-sos{color:var(--red)}
.tabs a.tab-sos.on{background:var(--red-wash)}
@media (min-width:700px){
  .tabs{left:50%;right:auto;transform:translateX(-50%);width:520px;bottom:12px;border-radius:20px;
    border:1px solid var(--line);height:var(--tab-h);padding:0 6px;box-shadow:var(--shadow)}
}

/* ---------- bảng trượt ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-scrim{position:absolute;inset:0;background:rgba(10,14,20,.45);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--ground);border-radius:22px 22px 0 0;padding-bottom:var(--safe-b);
  animation:up .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 20px}
.sheet-head h2{flex:1;font-size:19px}
.sheet-x{width:44px;height:44px;border:0;background:var(--surface-2);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.sheet-body{overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain}
.sheet-body .block{margin-bottom:12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-scrim{animation:none}}

/* ---------- thông báo nhỏ ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:60;
  background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;
  box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.alarm-bar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;margin:0 -16px 10px;
  padding:12px 16px;background:var(--red);color:var(--on-red);display:flex;align-items:center;gap:10px;font-weight:700}
.alarm-bar span{flex:1}
.alarm-bar .btn{background:var(--on-red);color:var(--red);border:0;min-height:38px}

/* ---------- "Đây là gì?" (mặc định gập lại) ---------- */
.about{background:var(--surface);border-radius:var(--r-m);border:1px solid var(--line-2);
  margin:0 0 14px;border-left:4px solid var(--brand-2)}
.about>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;cursor:pointer}
.about>summary::-webkit-details-marker{display:none}
.about-label{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-2)}
.about-hint{flex:1;font-size:14px;color:var(--ink-3)}
.about[open] .about-hint{visibility:hidden}
.about .tw{color:var(--ink-mute);transition:transform .2s}
.about[open] .tw{transform:rotate(90deg)}
.about p{margin:0;padding:0 16px 16px;color:var(--ink-2);font-size:16px;line-height:1.6}

/* ---------- từ có giải thích ---------- */
.term{display:inline;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  text-decoration:underline dotted;text-decoration-color:var(--brand-2);text-decoration-thickness:2px;
  text-underline-offset:3px;border-radius:3px}
.term:active{background:var(--brand-wash)}
.term-demo{text-decoration:underline dotted;text-decoration-color:var(--brand-2);text-decoration-thickness:2px;text-underline-offset:3px}
.term-card{background:var(--surface);border-radius:var(--r-card);border:1px solid var(--line-2);padding:16px;margin-bottom:12px}
.term-card p{margin:0;font-size:17px;line-height:1.6}

/* ---------- trang từ ngữ ---------- */
.gloss-link{display:flex;align-items:center;gap:14px;margin-top:14px;padding:15px 16px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);text-decoration:none}
.gloss-link:active{background:var(--surface-2)}
.gloss{display:flex;flex-direction:column;gap:10px}
.gl{background:var(--surface);border-radius:var(--r-m);border:1px solid var(--line-2);padding:14px 16px}
.gl h2{font-size:17px}
.gl-alias{font-size:13px;color:var(--ink-3);margin-top:2px}
.gl p{margin:6px 0 0;color:var(--ink-2);font-size:16px}

</style>
</head>
