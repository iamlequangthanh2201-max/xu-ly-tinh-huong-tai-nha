<script id="data" type="application/json">{"skills":[{"id":"K1","title":"Cho bé ợ hơi","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Lót một khăn trên vai bố mẹ.","children":[]},{"text":"Chọn một trong 3 tư thế:","children":["**Tựa vai:** bế bé thẳng đứng, cằm bé tựa lên vai bạn.","**Ngồi trên đùi:** cho bé ngồi, một tay đỡ ngực và cằm bé (không bóp cổ), người bé hơi nghiêng về trước.","**Nằm sấp trên đùi:** đặt bé nằm sấp ngang đùi, đầu cao hơn ngực một chút."]},{"text":"Dùng lòng bàn tay khum lại, vỗ nhẹ hoặc xoa vòng tròn ở giữa lưng bé.","children":[]},{"text":"Làm trong 1-3 phút. Nếu chưa ợ, đổi tư thế và thử lại thêm 1-2 phút.","children":[]},{"text":"Thời điểm: bú mẹ thì cho ợ khi đổi bên; bú bình thì cho ợ sau mỗi 30-60 ml; và luôn cho ợ khi kết thúc cữ.","children":[]},{"text":"Không ợ được cũng không sao, bế đứng thêm 10-15 phút.","children":[]}],"kind":"steps"}],"keywords":"ợ hơi, vỗ ợ","audience":"be","short":"Cách cho ợ hơi"},{"id":"K2","title":"Nhỏ nước muối và hút mũi","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Rửa tay sạch.","children":[]},{"text":"Cho bé nằm ngửa, nghiêng đầu sang một bên.","children":[]},{"text":"Nhỏ 1-2 giọt nước muối sinh lý 0,9% vào lỗ mũi phía trên.","children":[]},{"text":"Đợi khoảng 30 giây cho gỉ mũi mềm ra.","children":[]},{"text":"Bóp xẹp quả bóp hút mũi trước, đưa đầu hút vào lỗ mũi nông (không đưa sâu), rồi thả tay từ từ.","children":[]},{"text":"Lau sạch đầu hút, làm tương tự với bên còn lại.","children":[]},{"text":"Chỉ hút tối đa 3-4 lần/ngày, nên làm trước cữ bú và trước khi ngủ.","children":[]},{"text":"Rửa sạch dụng cụ bằng nước xà phòng sau mỗi lần dùng.","children":[]}],"kind":"steps"}],"keywords":"nước muối, hút mũi","audience":"be","short":"Cách hút mũi"},{"id":"K3","title":"Đo nhiệt độ","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Dùng nhiệt kế điện tử (không dùng nhiệt kế thủy ngân).","children":[]},{"text":"Đo ở nách: lau khô nách, đặt đầu nhiệt kế vào giữa nách, khép tay bé áp sát người, giữ cho đến khi máy kêu.","children":[]},{"text":"Đo hậu môn (chính xác nhất với bé dưới 3 tháng): bôi một chút vaselin vào đầu nhiệt kế, cho bé nằm ngửa co chân, đưa vào hậu môn khoảng 1-2 cm, giữ đến khi máy kêu.","children":[]},{"text":"Không đo ngay sau khi tắm, bú hoặc khi bé vừa được ủ ấm, đợi 15-20 phút.","children":[]},{"text":"Ghi lại: giờ đo, vị trí đo, kết quả.","children":[]},{"text":"Mức tham khảo: bình thường 36,5-37,5°C. Từ 38°C trở lên là sốt.","children":[]}],"kind":"steps"}],"keywords":"đo nhiệt độ, nhiệt kế, cặp nhiệt","audience":"be","short":"Cách đo nhiệt độ"},{"id":"K4","title":"Đếm nhịp thở","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Đếm khi bé đang nằm yên hoặc đang ngủ.","children":[]},{"text":"Kéo áo lên để nhìn rõ bụng và ngực.","children":[]},{"text":"Đếm số lần bụng phồng lên trong đúng 60 giây (không đếm 15 giây rồi nhân 4 vì trẻ sơ sinh thở không đều).","children":[]},{"text":"Bình thường ở trẻ dưới 2 tháng: 30-60 lần/phút. Trên 60 lần/phút là thở nhanh.","children":[]},{"text":"Quan sát thêm: lõm ngực dưới xương sườn khi hít vào, cánh mũi phập phồng, môi tím. Có những dấu hiệu này là 🔴.","children":[]}],"kind":"steps"}],"keywords":"nhịp thở, thở nhanh, đếm thở","audience":"be","short":"Cách đếm nhịp thở"},{"id":"K5","title":"Kiểm tra dấu hiệu mất nước","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Đếm số tã ướt trong 24 giờ. Từ ngày thứ 5 trở đi, bé cần có ít nhất 6 tã ướt mỗi ngày.","children":[]},{"text":"Nhìn môi và lưỡi: khô, nứt là dấu hiệu mất nước.","children":[]},{"text":"Sờ nhẹ thóp trước (chỗ mềm trên đỉnh đầu): thóp lõm xuống là dấu hiệu mất nước.","children":[]},{"text":"Khi bé khóc có nước mắt không (bé trên 1 tháng).","children":[]},{"text":"Bé có li bì, mệt hơn bình thường không.","children":[]},{"text":"Có từ 2 dấu hiệu trở lên: đi khám ngay.","children":[]}],"kind":"steps"}],"keywords":"mất nước, tã ướt, thóp lõm","audience":"be","short":"Kiểm tra mất nước"},{"id":"K6","title":"Sơ cứu hóc dị vật (bé dưới 1 tuổi)","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Bé còn ho được, khóc được: để bé tự ho, không vỗ, không móc họng, chỉ theo dõi sát.","children":[]},{"text":"Bé không ho, không khóc, không thở được, mặt tím: hô người khác gọi 115 ngay.","children":[]},{"text":"Đặt bé nằm sấp dọc theo cẳng tay bạn, đầu thấp hơn thân, bàn tay đỡ hàm bé (không bóp cổ). Tựa cẳng tay lên đùi cho chắc.","children":[]},{"text":"Dùng gốc bàn tay vỗ mạnh, dứt khoát 5 lần vào giữa hai xương bả vai.","children":[]},{"text":"Lật ngửa bé trên cẳng tay còn lại, đầu vẫn thấp hơn thân.","children":[]},{"text":"Đặt 2 ngón tay ở giữa ngực, ngay dưới đường nối hai núm vú. Ấn mạnh 5 lần, sâu khoảng 4 cm.","children":[]},{"text":"Nhìn vào miệng bé: chỉ lấy dị vật ra nếu thấy rõ. Không móc mù bằng ngón tay.","children":[]},{"text":"Lặp lại 5 lần vỗ lưng và 5 lần ấn ngực cho đến khi dị vật ra hoặc bé thở lại được.","children":[]},{"text":"Nếu bé bất tỉnh: đặt bé nằm ngửa trên mặt phẳng cứng, bắt đầu hồi sinh tim phổi (30 lần ép ngực, 2 lần thổi), tiếp tục cho đến khi nhân viên cấp cứu tới.","children":[]},{"text":"Sau khi sơ cứu thành công, vẫn đưa bé đi khám.","children":[]}],"kind":"steps"}],"notes":["Khuyến nghị bố mẹ và người trông bé tham gia một lớp sơ cứu thực hành, vì đọc khác rất xa với làm thật."],"keywords":"hóc, dị vật, sơ cứu, nghẹt thở, vỗ lưng ấn ngực","audience":"be","short":"Sơ cứu hóc dị vật"},{"id":"K7","title":"Quấn bé (chỉ dùng cho bé chưa biết lẫy)","severity":[],"sections":[{"label":null,"text":"","items":[{"text":"Trải khăn hình vuông thành hình thoi, gấp góc trên xuống khoảng 15 cm.","children":[]},{"text":"Đặt bé nằm ngửa, vai ngang mép gấp.","children":[]},{"text":"Giữ tay phải bé thẳng dọc thân, kéo góc khăn bên phải qua người, nhét dưới lưng bên trái.","children":[]},{"text":"Gấp góc dưới lên, để chân bé có chỗ co và dạng ra (hông phải cử động được, tránh loạn sản khớp háng).","children":[]},{"text":"Giữ tay trái bé thẳng, kéo góc khăn bên trái qua người, nhét dưới lưng.","children":[]},{"text":"Kiểm tra: luồn vừa 2-3 ngón tay giữa khăn và ngực bé.","children":[]},{"text":"Ngừng quấn khi bé bắt đầu có dấu hiệu lẫy (thường khoảng 2-4 tháng).","children":[]}],"kind":"steps"}],"keywords":"quấn, quấn chũn, quấn khăn","audience":"be","short":"Cách quấn bé"}],"situations":[{"id":"A1","title":"Trớ sữa","severity":["green"],"sections":[{"label":"Đây là gì","text":"Sữa trào ngược từ dạ dày lên miệng rồi chảy ra nhẹ nhàng (không phun mạnh), thường ngay sau bú hoặc khi bé ợ hơi. Xảy ra vì van giữa thực quản và dạ dày của bé chưa đóng chặt, dạ dày lại còn rất nhỏ. Rất phổ biến: khoảng một nửa số bé dưới 3 tháng trớ mỗi ngày, đa số hết khi bé khoảng 1 tuổi.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Giữ bình tĩnh. Nghiêng người hoặc đầu bé sang một bên, hoặc bế đứng hơi chúi về trước để sữa chảy ra ngoài, không chảy ngược vào mũi họng.","children":[]},{"text":"Lau sạch miệng và mũi bé bằng khăn mềm.","children":[]},{"text":"Nếu sữa trào lên mũi: làm theo K2 (nhỏ nước muối, hút mũi).","children":[]},{"text":"Quan sát 5-10 phút: bé thở đều, da hồng, không ho sặc là ổn.","children":[]},{"text":"Thay áo, khăn bị ướt.","children":[]},{"text":"Không cần cho bú bù ngay. Nếu bé đòi bú thì cho bú ít.","children":[]}],"kind":"steps"},{"label":"Phòng ngừa","text":"","items":[{"text":"Cho bú lượng vừa đủ, chia nhỏ cữ thay vì cho bú thật no một lần.","children":[]},{"text":"Bú bình: giữ bình nghiêng sao cho sữa luôn đầy núm, dùng núm có tốc độ chảy phù hợp tuổi.","children":[]},{"text":"Cho ợ hơi giữa và cuối cữ (xem K1).","children":[]},{"text":"Bế đứng 15-30 phút sau bú.","children":[]},{"text":"Tránh đè lên bụng, quấn tã chặt bụng, chơi đùa mạnh, tung bé lên ngay sau bú.","children":[]},{"text":"Khi ngủ vẫn đặt bé nằm ngửa trên mặt phẳng.","children":[]}],"kind":"prevent"},{"label":"Không nên","text":"","items":[{"text":"Dốc ngược bé.","children":[]},{"text":"Kê gối cao hoặc cho bé nằm nghiêng, nằm sấp khi ngủ để \"chống trớ\" (tăng nguy cơ đột tử).","children":[]},{"text":"Tự ý pha sữa đặc hơn hoặc đổi sữa liên tục.","children":[]}],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Trớ ra dịch xanh hoặc có máu","children":[]},{"text":"Nôn vọt thành tia","children":[]},{"text":"Bé không tăng cân","children":[]},{"text":"Quấy khóc ưỡn người dữ dội khi bú","children":[]},{"text":"Có dấu hiệu mất nước (K5)","children":[]}],"kind":"doctor"}],"keywords":"ọc sữa, ói, nôn, trào sữa, trớ","audience":"be"},{"id":"A2","title":"Nôn vọt / nôn ra dịch xanh","severity":["red"],"sections":[{"label":"Đây là gì","text":"Khác với trớ, nôn vọt là sữa bị phun ra mạnh thành tia, có thể bắn xa. Nếu xảy ra sau hầu hết các cữ bú ở bé 2-8 tuần tuổi, có thể do hẹp môn vị. Nôn ra dịch xanh (màu xanh lá như mật) có thể là dấu hiệu tắc ruột. Cả hai đều cần bác sĩ khám ngay.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Cho bé nằm nghiêng để tránh hít chất nôn.","children":[]},{"text":"Lau sạch miệng và mũi.","children":[]},{"text":"Ghi lại: giờ nôn, số lần, màu dịch nôn. Nếu được, chụp ảnh dịch nôn.","children":[]},{"text":"Tạm ngưng cho bú, đưa bé đi khám ngay.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"tự cho uống thuốc chống nôn.","items":[],"kind":"avoid"}],"keywords":"nôn, ói, ói vọt, nôn mật, dịch xanh, hẹp môn vị","audience":"be"},{"id":"A3","title":"Sặc sữa","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Sữa đi nhầm vào đường thở thay vì xuống dạ dày, làm bé ho, đỏ mặt, có khi ngừng thở vài giây. Hay gặp khi sữa chảy quá nhanh (mẹ nhiều sữa, núm bình lỗ to) hoặc bé vừa bú vừa khóc. Phần lớn bé tự ho ra được. Nguy hiểm khi bé không ho, không khóc được và bị tím tái.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Ngừng cho bú ngay, rút ti hoặc bình ra.","children":[]},{"text":"Đặt bé nằm sấp trên cẳng tay, đầu thấp hơn ngực, tay đỡ hàm bé.","children":[]},{"text":"Vỗ lưng giữa hai xương bả vai bằng gốc bàn tay, vừa phải, khoảng 5 lần.","children":[]},{"text":"Lau sạch sữa ở miệng. Nếu sữa trào lên mũi, hút mũi (K2).","children":[]},{"text":"Bé ho được, khóc to, da hồng: để bé tự ho và theo dõi thêm.","children":[]},{"text":"Bé tím tái, không khóc, không thở: gọi 115 và làm theo K6.","children":[]}],"kind":"steps"},{"label":"Phòng ngừa","text":"","items":[{"text":"Cho bú ở tư thế đầu bé cao hơn bụng.","children":[]},{"text":"Mẹ nhiều sữa, tia sữa mạnh: vắt bớt một ít trước khi cho bú, hoặc cho bú ở tư thế mẹ ngả lưng ra sau.","children":[]},{"text":"Không cho bú khi bé đang khóc dữ hoặc đã ngủ say.","children":[]},{"text":"Bú bình: chọn núm có lỗ nhỏ, cho bú theo nhịp và cho bé nghỉ giữa chừng.","children":[]}],"kind":"prevent"},{"label":"Không nên","text":"gác bình cho bé tự bú, bỏ bé một mình khi đang bú.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Sau khi sặc bé thở nhanh","children":[]},{"text":"Khò khè kéo dài","children":[]},{"text":"Sốt","children":[]},{"text":"Đã từng tím tái, dù sau đó bé hồng hào trở lại","children":[]}],"kind":"doctor"}],"keywords":"sặc, sặc sữa, ho khi bú, tím tái, nghẹn","audience":"be"},{"id":"A4","title":"Nấc cụt","severity":["green"],"sections":[{"label":"Đây là gì","text":"Cơ hoành co giật bất chợt, tạo ra tiếng \"hức\" đều đều. Ở trẻ nhỏ thường do bú nhanh, nuốt nhiều hơi hoặc dạ dày căng. Nấc không làm bé đau và tự hết.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Nếu đang bú: tạm dừng, cho bé ợ hơi (K1).","children":[]},{"text":"Bế bé thẳng đứng, xoa lưng nhẹ.","children":[]},{"text":"Có thể cho bé bú lại vài ngụm hoặc ngậm ti giả.","children":[]},{"text":"Nếu bé không khó chịu, cứ để tự hết (thường trong 5-10 phút).","children":[]}],"kind":"steps"},{"label":"Không nên","text":"làm bé giật mình, kéo lưỡi, dán giấy lên trán, cho bé dưới 6 tháng uống nước.","items":[],"kind":"avoid"}],"keywords":"nấc, nấc cụt","audience":"be"},{"id":"A5","title":"Đầy hơi","severity":["green"],"sections":[{"label":"Đây là gì","text":"Bé nuốt không khí khi bú hoặc khi khóc, hơi đọng lại trong dạ dày và ruột làm bụng căng, bé vặn mình, xì hơi nhiều, quấy khó chịu. Ruột trẻ sơ sinh còn non nên hay bị như vậy trong vài tháng đầu.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Cho bé ợ hơi (K1).","children":[]},{"text":"Đặt bé nằm ngửa, cầm hai cổ chân, đạp xe nhẹ nhàng 10-15 vòng.","children":[]},{"text":"Gập hai đầu gối bé áp nhẹ lên bụng, giữ 5-10 giây rồi duỗi ra. Lặp lại 5 lần.","children":[]},{"text":"Massage bụng (khi rốn đã lành hẳn): xoa ấm tay, dùng một ít dầu massage cho bé, xoa vòng tròn quanh rốn theo chiều kim đồng hồ khoảng 3-5 phút.","children":[]},{"text":"Khi bé thức và có người trông, cho bé nằm sấp chơi vài phút.","children":[]}],"kind":"steps"},{"label":"Phòng ngừa","text":"","items":[{"text":"Kiểm tra khớp ngậm khi bú mẹ (miệng mở rộng, ngậm cả quầng vú, không nghe tiếng \"chụt chụt\").","children":[]},{"text":"Bú bình: giữ sữa luôn đầy núm, pha sữa xong để lắng bọt rồi mới cho bú.","children":[]},{"text":"Cho ợ hơi đều đặn.","children":[]}],"kind":"prevent"},{"label":"Đi khám khi","text":"","items":[{"text":"Bụng chướng căng","children":[]},{"text":"Gõ vào nghe \"bùng bục\"","children":[]},{"text":"Đầy hơi kèm nôn, hoặc không đi ngoài","children":[]},{"text":"Bé khóc thét","children":[]}],"kind":"doctor"}],"keywords":"đầy hơi, xì hơi, chướng bụng, đau bụng, ợ","audience":"be"},{"id":"A6","title":"Khóc nhiều, khóc dạ đề","severity":["green"],"sections":[{"label":"Đây là gì","text":"Khóc dạ đề là khi một em bé khỏe mạnh khóc rất lâu, rất khó dỗ, thường vào chiều tối, dù đã được ăn no và thay tã. Mốc hay dùng: khóc trên 3 giờ/ngày, trên 3 ngày/tuần. Thường bắt đầu từ tuần 2-3, nặng nhất khoảng tuần 6, tự hết khi bé 3-4 tháng. Nguyên nhân chưa rõ, không phải do bố mẹ chăm sai.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Kiểm tra lần lượt các nhu cầu cơ bản:","children":["Đói? (bé mút tay, quay đầu tìm vú)","Tã ướt, bẩn?","Nóng hoặc lạnh? (sờ gáy bé: nóng ẩm là nóng, mát lạnh là lạnh)","Cần ợ hơi?","Quần áo chật, mác áo cọ vào da?","**Có sợi tóc quấn chặt ngón tay, ngón chân hoặc dương vật không?** (rất dễ bị bỏ sót)"]},{"text":"Đo nhiệt độ (K3) nếu bé khóc khác thường.","children":[]},{"text":"Nếu mọi thứ ổn, áp dụng lần lượt cách \"5S\":","children":["**Quấn:** quấn bé (K7).","**Bế nghiêng:** bế bé nằm nghiêng hoặc nằm sấp dọc cẳng tay (chỉ khi bế; đặt xuống ngủ phải nằm ngửa).","**Tiếng \"suỵt\":** phát tiếng \"suỵt\" đều đều gần tai bé, hoặc bật tiếng ồn trắng (tiếng máy sấy, tiếng mưa) ở âm lượng vừa.","**Đung đưa:** đung đưa nhẹ nhàng, nhịp nhỏ và đều.","**Cho mút:** cho bú hoặc ngậm ti giả."]},{"text":"Giảm kích thích: phòng tối, yên tĩnh, ít người bế chuyền tay.","children":[]},{"text":"Thử đổi không gian: đẩy xe đi dạo, bế ra ban công.","children":[]},{"text":"**Nếu bố mẹ quá căng thẳng:** đặt bé nằm ngửa trong cũi an toàn, ra khỏi phòng 5-10 phút để hít thở, hoặc nhờ người khác bế thay. Để bé khóc một lúc còn an toàn hơn nhiều so với bế bé trong lúc mất bình tĩnh.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"**TUYỆT ĐỐI KHÔNG LẮC BÉ.** Không cho bé uống nước, thảo dược, thuốc an thần tự mua.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Bé khóc thét khác hẳn mọi khi","children":[]},{"text":"Khóc kèm sốt, nôn, bỏ bú hoặc li bì","children":[]},{"text":"Bố mẹ cảm thấy không thể chịu đựng thêm","children":[]}],"kind":"doctor"}],"keywords":"khóc, khóc đêm, quấy, dạ đề, colic, không nín","audience":"be"},{"id":"A7","title":"Táo bón","severity":["green","yellow"],"sections":[{"label":"Đây là gì","text":"Phân của bé cứng, khô, vón thành viên, bé phải rặn rất đau. Số ngày không đi ngoài không phải yếu tố chính: bé bú mẹ có thể vài ngày mới đi một lần mà phân vẫn mềm, như vậy không phải táo bón. Bé uống sữa công thức hay bị hơn bé bú mẹ.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Xác định có đúng là táo bón không: phân cứng, thành viên nhỏ, bé rặn đau và khóc. (Bé rặn đỏ mặt nhưng phân ra vẫn mềm là bình thường, do bé chưa phối hợp được cơ bụng và cơ hậu môn.)","children":[]},{"text":"Bé bú mẹ: cho bú nhiều cữ hơn.","children":[]},{"text":"Bé bú sữa công thức: kiểm tra lại cách pha, phải đúng tỉ lệ nước và bột ghi trên hộp, không pha đặc.","children":[]},{"text":"Đạp xe chân và massage bụng (xem A5).","children":[]},{"text":"Tắm nước ấm cho bé thư giãn.","children":[]},{"text":"Bé trên 6 tháng đã ăn dặm: thêm rau xanh, trái cây nghiền (lê, đu đủ, mận), cho uống thêm nước.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"tự ý dùng que thông, thuốc thụt hậu môn, mẹo dân gian (lá mồng tơi nhét hậu môn, nước mía). Không cho bé dưới 1 tuổi ăn mật ong.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Phân có máu","children":[]},{"text":"Bụng chướng","children":[]},{"text":"Táo bón kèm nôn","children":[]},{"text":"Bé trên 5-7 ngày không đi ngoài kèm khó chịu","children":[]},{"text":"Bé dưới 1 tháng bị táo bón","children":[]}],"kind":"doctor"}],"keywords":"táo bón, không đi ị, phân cứng, rặn","audience":"be"},{"id":"A8","title":"Tiêu chảy","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Bé đi ngoài nhiều lần hơn hẳn mọi ngày, phân lỏng toàn nước. Phân bé bú mẹ vốn lỏng, vàng, lợn cợn và đi nhiều lần, nên cần so với \"mọi khi\" của chính bé. Nguy hiểm lớn nhất là mất nước, vì cơ thể bé nhỏ nên mất nước rất nhanh.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Tiếp tục cho bú mẹ, tăng số cữ bú.","children":[]},{"text":"Bé bú sữa công thức: vẫn pha đúng tỉ lệ, không pha loãng.","children":[]},{"text":"Kiểm tra dấu hiệu mất nước (K5) mỗi vài giờ. Đánh dấu số tã ướt.","children":[]},{"text":"Dung dịch bù nước (ORS): với bé dưới 6 tháng, hỏi bác sĩ trước khi dùng. Khi dùng phải pha đúng lượng nước ghi trên gói, không pha thiếu nước.","children":[]},{"text":"Rửa mông bằng nước ấm sau mỗi lần đi, thấm khô, bôi kem chống hăm có kẽm.","children":[]},{"text":"Rửa tay kỹ, tiệt trùng bình sữa, núm vú.","children":[]},{"text":"Chụp ảnh tã để đưa bác sĩ xem.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"dùng thuốc cầm tiêu chảy, cho uống nước đường, nước ngọt, nước cơm pha muối tự chế.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Bé dưới 3 tháng bị tiêu chảy","children":[]},{"text":"Phân có máu hoặc nhầy nhiều","children":[]},{"text":"Nôn liên tục","children":[]},{"text":"Sốt","children":[]},{"text":"Có từ 2 dấu hiệu mất nước trở lên","children":[]}],"kind":"doctor"}],"keywords":"tiêu chảy, đi ngoài nhiều, phân lỏng, ị nhiều, mất nước","audience":"be"},{"id":"A9","title":"Vàng da","severity":["green","red"],"sections":[{"label":"Đây là gì","text":"Da và lòng trắng mắt bé ngả màu vàng, do trong máu có nhiều bilirubin mà gan của bé chưa đủ sức đào thải. Vàng da sinh lý rất thường gặp, xuất hiện ngày 2-3 và tự hết sau 1-2 tuần. Vàng da quá sớm, quá đậm hoặc kéo dài có thể gây hại cho não nên cần đi khám.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Kiểm tra dưới ánh sáng tự nhiên ban ngày (gần cửa sổ, không dưới đèn vàng).","children":[]},{"text":"Ấn nhẹ ngón tay lên da bé ở lần lượt: trán, ngực, bụng, đùi, cẳng chân, lòng bàn chân. Buông tay ra và xem chỗ vừa ấn có màu vàng không.","children":[]},{"text":"Ghi lại vàng da đã lan tới vùng nào. Vàng càng lan xuống dưới thì càng nặng.","children":[]},{"text":"Cho bú nhiều, 8-12 cữ/ngày, để bé đi ngoài nhiều và thải bớt chất gây vàng da.","children":[]},{"text":"Theo dõi phân và nước tiểu: phân vàng, nước tiểu trong là tốt.","children":[]},{"text":"Đi tái khám đúng lịch hẹn sau khi ra viện.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"phơi nắng trực tiếp để chữa vàng da (dễ bỏng, mất nhiệt và không đủ hiệu quả), cho uống nước đường, tự ý ngưng bú mẹ.","items":[],"kind":"avoid"},{"label":"Đi khám ngay khi","text":"","items":[{"text":"Vàng da xuất hiện trong 24 giờ đầu sau sinh","children":[]},{"text":"Vàng lan xuống bụng, đùi, lòng bàn tay, bàn chân","children":[]},{"text":"Kéo dài quá 2 tuần","children":[]},{"text":"Bé ngủ li bì","children":[]},{"text":"Bú kém","children":[]},{"text":"**Phân bạc màu (trắng, xám, vàng nhạt như màu đất sét)**","children":[]}],"kind":"doctor"}],"keywords":"vàng da, da vàng, mắt vàng, phân trắng","audience":"be"},{"id":"A10","title":"Hăm tã","severity":["green"],"sections":[{"label":"Đây là gì","text":"Vùng da trong tã (mông, bẹn, bộ phận sinh dục) bị đỏ, rát, có khi nổi mụn nhỏ hoặc trợt da. Do da tiếp xúc lâu với nước tiểu, phân, hơi ẩm và cọ xát với tã. Thường khỏi sau vài ngày nếu giữ khô thoáng.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Thay tã ngay khi ướt hoặc bẩn, ít nhất 2-3 giờ một lần.","children":[]},{"text":"Rửa mông bằng nước ấm và khăn mềm. Hạn chế khăn ướt có cồn, có hương liệu.","children":[]},{"text":"Thấm khô (không chà xát), để mông bé thoáng khí 10-15 phút.","children":[]},{"text":"Bôi một lớp kem có kẽm oxit thật dày, như phết bơ.","children":[]},{"text":"Lần thay tã sau không cần lau sạch hết lớp kem cũ, chỉ lau phần bẩn rồi bôi thêm.","children":[]},{"text":"Mặc tã rộng hơn một chút, không dán quá chặt.","children":[]},{"text":"Bé gái: luôn lau từ trước ra sau.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"dùng phấn rôm, xà phòng tắm người lớn, tự bôi kem có corticoid.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Không đỡ sau 2-3 ngày","children":[]},{"text":"Có mụn mủ","children":[]},{"text":"Lở loét","children":[]},{"text":"Có mảng đỏ kèm các nốt đỏ nhỏ xung quanh (dấu hiệu nhiễm nấm)","children":[]},{"text":"Bé sốt","children":[]}],"kind":"doctor"}],"keywords":"hăm, hăm tã, đỏ mông, nấm","audience":"be"},{"id":"A11","title":"Mụn sữa, ban đỏ sơ sinh","severity":["green"],"sections":[{"label":"Đây là gì","text":"Mụn sữa là những nốt nhỏ màu trắng hoặc đỏ trên má, mũi, trán, hay xuất hiện ở tuần 2-4, do hormone từ mẹ truyền sang. Ban đỏ sơ sinh là những mảng đỏ có chấm vàng trắng ở giữa, nổi rồi lặn ở nhiều chỗ trong tuần đầu. Cả hai đều vô hại, tự hết, không phải do sữa hay do dị ứng.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Rửa mặt bé bằng nước ấm 1-2 lần/ngày, thấm khô bằng khăn mềm.","children":[]},{"text":"Lau sạch sữa trớ, nước dãi trên mặt ngay khi có.","children":[]},{"text":"Cắt móng tay cho bé hoặc đeo bao tay để bé không cào.","children":[]},{"text":"Để tự hết (thường vài tuần).","children":[]}],"kind":"steps"},{"label":"Không nên","text":"nặn mụn, bôi kem dưỡng, dầu, sữa mẹ lên mụn.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Mụn mủ lan rộng","children":[]},{"text":"Bé sốt","children":[]},{"text":"Bé bỏ bú","children":[]}],"kind":"doctor"}],"keywords":"mụn, mụn sữa, ban đỏ, nổi mẩn","audience":"be"},{"id":"A12","title":"Chàm sữa","severity":["yellow"],"sections":[{"label":"Đây là gì","text":"Tên dân gian của viêm da cơ địa: da khô, đỏ, ráp, rất ngứa, hay gặp ở má, trán, các nếp gấp tay chân. Do lớp bảo vệ của da bé yếu nên da dễ mất nước và dễ bị kích ứng. Hay gặp ở bé có bố mẹ bị dị ứng, hen, viêm mũi dị ứng. Bệnh hay tái đi tái lại, nhiều bé đỡ dần khi lớn.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Tắm bằng nước ấm (không nóng), trong 5-10 phút.","children":[]},{"text":"Dùng sữa tắm dịu nhẹ, không mùi, hoặc chỉ dùng nước.","children":[]},{"text":"Thấm khô nhẹ, sau đó **bôi kem dưỡng ẩm trong vòng 3 phút** khi da còn hơi ẩm.","children":[]},{"text":"Dưỡng ẩm 2-3 lần/ngày, kể cả những ngày da đã đỡ.","children":[]},{"text":"Mặc quần áo cotton mềm. Giặt đồ bé bằng nước giặt không mùi, xả kỹ.","children":[]},{"text":"Cắt ngắn móng tay bé.","children":[]},{"text":"Giữ phòng mát, tránh để bé ra nhiều mồ hôi.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"tắm lá, tự bôi thuốc có corticoid, kiêng ăn quá mức khi chưa có chỉ định.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Da chảy dịch","children":[]},{"text":"Đóng vảy vàng","children":[]},{"text":"Có mủ","children":[]},{"text":"Bé ngứa đến mất ngủ","children":[]},{"text":"Không đỡ sau 1 tuần chăm sóc","children":[]}],"kind":"doctor"}],"keywords":"chàm, chàm sữa, viêm da, ngứa, khô da","audience":"be"},{"id":"A13","title":"Cứt trâu","severity":["green"],"sections":[{"label":"Đây là gì","text":"Những mảng vảy vàng, nhờn hoặc khô bám trên da đầu, đôi khi ở lông mày, sau tai. Do tuyến dầu trên da đầu bé hoạt động mạnh trong những tháng đầu. Không ngứa, không lây, không phải do bé bẩn, thường tự hết sau vài tháng.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Thoa một lớp dầu (dầu dừa, dầu olive hoặc dầu em bé) lên vùng có vảy, để 15-20 phút.","children":[]},{"text":"Dùng lược răng mềm hoặc bàn chải mềm chải nhẹ cho vảy bong ra.","children":[]},{"text":"Gội sạch lại bằng dầu gội em bé để không còn dầu bám.","children":[]},{"text":"Lặp lại vài ngày một lần cho đến khi hết.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"cạy, gỡ bằng móng tay.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Lan ra mặt, sau tai","children":[]},{"text":"Chảy dịch","children":[]},{"text":"Đỏ nhiều","children":[]}],"kind":"doctor"}],"keywords":"cứt trâu, vảy đầu, gàu","audience":"be"},{"id":"A14","title":"Rôm sảy","severity":["green"],"sections":[{"label":"Đây là gì","text":"Những nốt li ti màu đỏ hoặc trong như giọt nước, hay ở cổ, lưng, ngực, nách, xuất hiện khi bé bị nóng và ra nhiều mồ hôi. Do tuyến mồ hôi của bé còn non nên dễ bị tắc. Hết nhanh khi được làm mát.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Đưa bé đến chỗ thoáng mát.","children":[]},{"text":"Cởi bớt quần áo, chỉ mặc một lớp cotton mỏng.","children":[]},{"text":"Lau người hoặc tắm cho bé bằng nước ấm.","children":[]},{"text":"Để da khô thoáng tự nhiên.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"bôi phấn rôm, kem đặc, ủ bé nhiều lớp.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Nốt rôm có mủ","children":[]},{"text":"Bé sốt","children":[]}],"kind":"doctor"}],"keywords":"rôm, rôm sảy, nóng","audience":"be"},{"id":"A15","title":"Chăm sóc rốn","severity":["green"],"sections":[{"label":"Đây là gì","text":"Sau khi cắt dây rốn, trên rốn bé còn một đoạn cuống nhỏ. Cuống khô dần, chuyển từ vàng xanh sang nâu đen rồi tự rụng sau 1-3 tuần. Lúc sắp rụng và vừa rụng có thể rỉ chút dịch hoặc vài giọt máu, là bình thường. Việc chính là giữ rốn khô sạch để không bị nhiễm trùng.","items":[],"kind":"about"},{"label":"Hằng ngày","text":"","items":[{"text":"Rửa tay sạch trước khi chạm vào rốn.","children":[]},{"text":"Giữ rốn khô và sạch, để hở, không băng kín.","children":[]},{"text":"Gập mép trên của tã xuống dưới rốn để rốn không bị nước tiểu làm ướt.","children":[]},{"text":"Nếu rốn bị dính phân hoặc nước tiểu: rửa bằng nước sạch hoặc nước muối sinh lý, thấm khô.","children":[]},{"text":"Tắm lau người cho đến khi rốn rụng, hoặc nếu tắm chậu thì lau khô rốn ngay sau tắm.","children":[]},{"text":"Để cuống rốn tự rụng (thường 1-3 tuần).","children":[]}],"kind":"steps"},{"label":"Khi rốn rụng chảy vài giọt máu","text":"ấn nhẹ bằng gạc sạch vài phút, máu sẽ tự ngừng.","items":[],"kind":"info"},{"label":"Không nên","text":"giật cuống rốn, đắp nghệ, lá, thuốc lào, bôi thuốc đỏ, cồn khi không có chỉ định của bác sĩ.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Da quanh rốn đỏ lan rộng","children":[]},{"text":"Sưng, có mủ, mùi hôi","children":[]},{"text":"Chảy máu không cầm","children":[]},{"text":"Rốn ướt chảy dịch kéo dài sau khi đã rụng","children":[]},{"text":"Bé sốt","children":[]}],"kind":"doctor"}],"keywords":"rốn, cuống rốn, rụng rốn, rốn chảy máu, rốn có mủ","audience":"be"},{"id":"A16","title":"Nghẹt mũi","severity":["green"],"sections":[{"label":"Đây là gì","text":"Lỗ mũi trẻ sơ sinh rất nhỏ, chỉ một ít gỉ mũi, sữa trớ lên hoặc không khí khô cũng đủ làm bé thở khò khè, phì phò. Bé dưới 3 tháng chủ yếu thở bằng mũi nên nghẹt mũi làm bé khó bú và hay quấy. Đa số không phải bệnh, chỉ cần làm sạch mũi.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Nhỏ nước muối và hút mũi theo K2.","children":[]},{"text":"Làm trước cữ bú và trước khi ngủ để bé dễ thở khi bú.","children":[]},{"text":"Dùng máy tạo ẩm trong phòng nếu không khí khô (máy lạnh).","children":[]},{"text":"Cho bú nhiều hơn để bé đủ nước.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"dùng dầu gió, tinh dầu, thuốc nhỏ mũi co mạch, hút mũi bằng miệng, hút quá nhiều lần trong ngày.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Thở nhanh","children":[]},{"text":"Rút lõm ngực (K4)","children":[]},{"text":"Sốt","children":[]},{"text":"Bú kém","children":[]},{"text":"Nghẹt mũi kéo dài trên 10 ngày","children":[]}],"kind":"doctor"}],"keywords":"nghẹt mũi, sổ mũi, khò khè, hút mũi, ngạt mũi, ho, hắt hơi","audience":"be"},{"id":"A17","title":"Sốt","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Sốt là khi thân nhiệt từ 38°C trở lên. Sốt là cách cơ thể chống lại nhiễm trùng, bản thân nó không phải bệnh. Nhưng ở bé dưới 3 tháng, sức đề kháng còn yếu, nhiễm trùng có thể nặng lên rất nhanh mà không có dấu hiệu nào khác, nên sốt ở tuổi này luôn phải đi khám ngay.","items":[],"kind":"about"},{"label":"Bé dưới 3 tháng, từ 38°C trở lên","text":"","items":[{"text":"Đo lại theo K3 để chắc chắn.","children":[]},{"text":"Cởi bớt quần áo, mặc một lớp thoáng.","children":[]},{"text":"**Đưa bé đi cấp cứu ngay**, mang theo sổ khám, giấy ra viện.","children":[]},{"text":"Không tự cho uống thuốc hạ sốt trước khi bác sĩ khám.","children":[]}],"kind":"steps"},{"label":"Bé 3-12 tháng","text":"","items":[{"text":"Đo nhiệt độ (K3), ghi lại.","children":[]},{"text":"Mặc thoáng, giữ phòng mát (26-28°C).","children":[]},{"text":"Cho bú nhiều hơn.","children":[]},{"text":"Khi sốt từ 38,5°C trở lên và bé khó chịu: dùng paracetamol đúng liều theo cân nặng như bác sĩ hoặc dược sĩ hướng dẫn (thường 10-15 mg/kg/lần, cách nhau ít nhất 4-6 giờ). Dùng đúng dụng cụ đo liều kèm theo chai thuốc.","children":[]},{"text":"Lau người bằng khăn nhúng nước ấm, tập trung ở trán, nách, bẹn.","children":[]},{"text":"Đo lại sau 30-60 phút, rồi theo dõi mỗi 1-2 giờ.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"ủ ấm, đắp chăn cho \"ra mồ hôi\", chườm đá, lau cồn, dùng aspirin, dùng ibuprofen cho bé dưới 6 tháng.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Bé 3-6 tháng sốt bất kỳ","children":[]},{"text":"Sốt từ 39°C trở lên","children":[]},{"text":"Sốt trên 24 giờ","children":[]},{"text":"Bé li bì","children":[]},{"text":"Bỏ bú","children":[]},{"text":"Co giật","children":[]},{"text":"Nổi ban","children":[]},{"text":"Thở nhanh","children":[]}],"kind":"doctor"}],"keywords":"sốt, nóng, nhiệt độ, hạ sốt, paracetamol","audience":"be"},{"id":"A18","title":"Hạ thân nhiệt (dưới 36,5°C)","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Thân nhiệt dưới 36,5°C. Trẻ sơ sinh mất nhiệt rất nhanh vì người nhỏ, ít mỡ, đầu lại to so với người. Bé bị lạnh có thể tay chân lạnh, da hơi tím, bú kém, lừ đừ. Ở trẻ sơ sinh, người lạnh đôi khi là dấu hiệu nhiễm trùng chứ không chỉ do thời tiết.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Đo lại nhiệt độ (K3).","children":[]},{"text":"Cho bé da kề da với mẹ hoặc bố: bé chỉ mặc tã, nằm áp ngực người lớn, đắp chăn lên cả hai.","children":[]},{"text":"Đội mũ, đi tất cho bé.","children":[]},{"text":"Tắt quạt, tăng nhiệt độ phòng.","children":[]},{"text":"Cho bé bú.","children":[]},{"text":"Đo lại sau 30 phút. Nếu không tăng lên trên 36,5°C, hoặc bé li bì, bú kém: đi khám ngay (ở trẻ sơ sinh, hạ thân nhiệt có thể là dấu hiệu nhiễm trùng).","children":[]}],"kind":"steps"}],"keywords":"lạnh, hạ thân nhiệt, người lạnh, nhiệt độ thấp","audience":"be"},{"id":"A19","title":"Ngủ ngày thức đêm","severity":["green"],"sections":[{"label":"Đây là gì","text":"Trong bụng mẹ bé chưa phân biệt ngày đêm, nên sau sinh nhiều bé ngủ say ban ngày và tỉnh táo ban đêm. Đồng hồ sinh học của bé hình thành dần trong 2-3 tháng đầu, nhờ ánh sáng ban ngày và sự yên tối ban đêm. Đây không phải bệnh.","items":[],"kind":"about"},{"label":"Làm hằng ngày","text":"","items":[{"text":"Ban ngày: kéo rèm cho nhà sáng, sinh hoạt bình thường, không cần giữ yên lặng tuyệt đối.","children":[]},{"text":"Ban ngày: không để bé ngủ quá 3 giờ liền mà không bú.","children":[]},{"text":"Ban đêm: phòng tối, chỉ dùng đèn ngủ nhỏ khi cho bú, thay tã.","children":[]},{"text":"Ban đêm: cho bú, thay tã nhanh gọn, nhẹ nhàng, ít nói chuyện và chơi đùa.","children":[]},{"text":"Tạo thói quen trước giờ ngủ đêm: tắm, massage, cho bú, ru, theo cùng một thứ tự mỗi ngày.","children":[]},{"text":"Kiên nhẫn: thường cải thiện dần sau 6-8 tuần.","children":[]}],"kind":"steps"}],"keywords":"ngủ ngày, thức đêm, lệch giờ, không ngủ đêm","audience":"be"},{"id":"A20","title":"Giật mình khi ngủ","severity":["green"],"sections":[{"label":"Đây là gì","text":"Đang ngủ, bé bỗng giật nảy người, dang hai tay ra rồi co lại, có khi tỉnh dậy khóc. Đây là phản xạ Moro, có ở mọi trẻ sơ sinh khỏe mạnh, thường hết khi bé 3-6 tháng. Bé cũng hay vặn mình, rặn è è, cử động lung tung khi ngủ nông, đều là bình thường.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Quấn bé (K7).","children":[]},{"text":"Khi đặt bé xuống: hạ lưng bé xuống trước, đầu xuống sau cùng, thật chậm.","children":[]},{"text":"Sau khi đặt xuống, giữ nhẹ tay lên ngực bé vài giây rồi mới rút tay ra.","children":[]},{"text":"Dùng tiếng ồn trắng đều đều để át tiếng động bất chợt.","children":[]}],"kind":"steps"},{"label":"An toàn khi ngủ (luôn áp dụng)","text":"","items":[{"text":"Đặt bé nằm ngửa.","children":[]},{"text":"Nệm phẳng, chắc, có ga bọc vừa khít.","children":[]},{"text":"Trong cũi không có gối, chăn dày, thú bông, quây cũi.","children":[]},{"text":"Bé ngủ chung phòng nhưng không ngủ chung giường với người lớn.","children":[]},{"text":"Không để phòng quá nóng, không cho bé mặc quá nhiều lớp.","children":[]}],"kind":"prevent"}],"keywords":"giật mình, vặn mình, ngủ không yên, quấn, ngủ an toàn","audience":"be"},{"id":"A21","title":"Tắc tuyến lệ, có ghèn","severity":["green"],"sections":[{"label":"Đây là gì","text":"Nước mắt bình thường chảy qua một ống nhỏ ở góc trong mắt xuống mũi. Ở nhiều bé ống này chưa thông hẳn, nên nước mắt đọng lại, mắt lúc nào cũng ướt, có ghèn vàng nhạt, nhất là khi ngủ dậy. Lòng trắng mắt không đỏ. Đa số tự thông trước 1 tuổi.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Rửa tay sạch.","children":[]},{"text":"Thấm bông gòn vào nước ấm đã đun sôi để nguội hoặc nước muối sinh lý.","children":[]},{"text":"Lau từ góc trong mắt (cạnh sống mũi) ra góc ngoài. Mỗi mắt dùng một miếng bông riêng.","children":[]},{"text":"Massage: đặt đầu ngón trỏ ở góc trong mắt, sát sống mũi, ấn nhẹ rồi vuốt xuống dọc theo sống mũi. Làm 5-10 lần, 2-3 lần/ngày.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"nhỏ sữa mẹ vào mắt, tự nhỏ thuốc kháng sinh.","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Mắt đỏ","children":[]},{"text":"Mi mắt sưng","children":[]},{"text":"Nhiều mủ vàng xanh","children":[]},{"text":"Không đỡ sau 6-12 tháng","children":[]}],"kind":"doctor"}],"keywords":"ghèn, gỉ mắt, chảy nước mắt, tắc lệ","audience":"be"},{"id":"A22","title":"Tưa lưỡi (nấm miệng)","severity":["yellow"],"sections":[{"label":"Đây là gì","text":"Nhiễm nấm trong miệng, tạo các mảng trắng như váng sữa trên lưỡi, má trong, lợi, bám chắc, lau không sạch. Bé có thể đau, bú kém, quấy khi bú. Nấm có thể lây qua lại giữa miệng bé và đầu ti của mẹ.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Phân biệt với cặn sữa: lấy gạc ẩm quấn ngón tay, lau nhẹ. Cặn sữa lau đi được. Mảng trắng bám chắc, lau ra có chỗ đỏ là nấm.","children":[]},{"text":"Nếu nghi nấm: đi khám để được kê thuốc.","children":[]},{"text":"Tiệt trùng ti giả, núm bình, dụng cụ hút sữa mỗi ngày.","children":[]},{"text":"Mẹ kiểm tra đầu ti: nếu đỏ, ngứa, đau rát, cần được điều trị cùng lúc với bé để không lây qua lại.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"cạo, rơ lưỡi mạnh, rơ lưỡi bằng mật ong.","items":[],"kind":"avoid"}],"keywords":"tưa, tưa lưỡi, nấm miệng, lưỡi trắng","audience":"be"},{"id":"A23","title":"Sưng vú sinh lý ở bé","severity":["green"],"sections":[{"label":"Đây là gì","text":"Trong những ngày đầu, cả bé trai và bé gái có thể bị sưng một hoặc hai bên vú, sờ thấy cục nhỏ, có khi rỉ ít dịch như sữa. Do hormone của mẹ truyền sang bé lúc còn trong bụng. Tự hết sau vài tuần đến vài tháng.","items":[],"kind":"about"},{"label":"Làm","text":"","items":[{"text":"Giữ sạch, để tự hết sau vài tuần.","children":[]},{"text":"Theo dõi vùng vú bé mỗi ngày.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"nặn, bóp, chườm nóng (dễ gây nhiễm trùng).","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Vùng vú đỏ, nóng","children":[]},{"text":"Bé đau khi chạm vào","children":[]},{"text":"Bé sốt","children":[]}],"kind":"doctor"}],"keywords":"sưng vú, vú bé, tiết sữa","audience":"be"},{"id":"A24","title":"Bé bị ngã","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Bé rơi từ giường, sofa, bàn thay tã hoặc tuột khỏi tay người bế. Bé có thể lăn ngay cả khi bố mẹ nghĩ bé \"chưa biết lăn\". Đầu bé to và nặng so với người nên khi ngã hay đập đầu trước. Phần lớn chỉ bị u, bầm nhẹ, nhưng cần theo dõi kỹ các dấu hiệu chấn thương đầu.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Nếu bé nằm im, không cử động: không vội bế lên, gọi 115.","children":[]},{"text":"Nếu bé khóc ngay và cử động tay chân bình thường: bế bé lên dỗ.","children":[]},{"text":"Kiểm tra đầu: có u, sưng, bầm, vết thương, thóp có phồng lên không.","children":[]},{"text":"Chườm lạnh chỗ sưng bằng khăn bọc đá trong 10 phút.","children":[]},{"text":"Theo dõi kỹ trong 24-48 giờ: bú, ngủ, mức tỉnh táo, nôn, cử động tay chân.","children":[]},{"text":"Nếu bé ngủ: vẫn cho ngủ, nhưng kiểm tra bé định kỳ trong vài giờ đầu (bé có phản ứng khi chạm vào, thở đều).","children":[]}],"kind":"steps"},{"label":"Đi cấp cứu khi","text":"","items":[{"text":"Bé dưới 3 tháng bị ngã đập đầu (nên khám dù trông có vẻ ổn)","children":[]},{"text":"Ngất dù chỉ vài giây","children":[]},{"text":"Nôn từ 2 lần trở lên","children":[]},{"text":"Li bì, khó đánh thức","children":[]},{"text":"Quấy khóc không dứt","children":[]},{"text":"Thóp phồng","children":[]},{"text":"Co giật","children":[]},{"text":"Chảy máu hoặc dịch trong ở tai hoặc mũi","children":[]}],"kind":"doctor"}],"keywords":"ngã, té, rơi, đập đầu, u đầu","audience":"be"},{"id":"A25","title":"Bỏng nước nóng","severity":["yellow","red"],"sections":[{"label":"Đây là gì","text":"Da bé mỏng hơn da người lớn rất nhiều, nước nóng có thể gây bỏng sâu chỉ trong vài giây. Hay gặp khi pha nước tắm, hoặc khi người lớn vừa bế bé vừa cầm cốc nước nóng. Vết bỏng có thể chỉ đỏ rát, phồng bọng nước, hoặc trắng bệch (bỏng sâu).","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Đưa bé ra khỏi nguồn nóng.","children":[]},{"text":"Cởi quần áo ở vùng bỏng (nếu vải dính vào da thì để nguyên, không giật ra).","children":[]},{"text":"Xả nước mát (không phải nước lạnh hay nước đá) lên vùng bỏng trong 20 phút.","children":[]},{"text":"Che vết bỏng bằng màng bọc thực phẩm hoặc gạc sạch, không quấn chặt.","children":[]},{"text":"Giữ ấm các vùng còn lại để bé không bị lạnh.","children":[]},{"text":"Đưa bé đi khám. Với trẻ sơ sinh, mọi vết bỏng đều nên được bác sĩ xem.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"bôi kem đánh răng, nước mắm, mỡ trăn, dầu ăn, chườm đá, chọc vỡ bọng nước.","items":[],"kind":"avoid"},{"label":"Phòng ngừa","text":"thử nước tắm bằng khuỷu tay (ấm vừa, khoảng 37°C), cho nước lạnh vào chậu trước rồi mới thêm nước nóng, không bế bé khi đang cầm đồ nóng.","items":[],"kind":"prevent"}],"keywords":"bỏng, phỏng, nước nóng","audience":"be"},{"id":"B1","title":"Sản dịch","severity":["green"],"sections":[{"label":"Đây là gì","text":"Sản dịch là máu và dịch chảy ra từ âm đạo sau sinh (kể cả sinh mổ), do lớp niêm mạc tử cung bong ra và chỗ nhau thai bám đang lành lại. Ban đầu đỏ tươi như hành kinh nhiều, rồi nhạt dần sang hồng, nâu, vàng trắng, kéo dài khoảng 4-6 tuần.","items":[],"kind":"about"},{"label":"Chăm sóc hằng ngày","text":"","items":[{"text":"Thay băng vệ sinh 3-4 giờ một lần, hoặc sớm hơn khi đầy.","children":[]},{"text":"Rửa vùng kín bằng nước sạch sau mỗi lần đi vệ sinh, lau từ trước ra sau.","children":[]},{"text":"Theo dõi màu sản dịch: đỏ tươi (vài ngày đầu), chuyển hồng nâu, rồi vàng trắng (kéo dài 4-6 tuần).","children":[]},{"text":"Vận động nhẹ nhàng để sản dịch ra đều.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"thụt rửa âm đạo, dùng tampon, ngâm mình trong bồn tắm khi chưa được bác sĩ cho phép.","items":[],"kind":"avoid"},{"label":"Đi cấp cứu khi","text":"","items":[{"text":"Thấm đẫm 1 băng vệ sinh trong vòng 1 giờ","children":[]},{"text":"Có cục máu đông to cỡ quả trứng gà","children":[]},{"text":"Sản dịch có mùi hôi","children":[]},{"text":"Sốt","children":[]},{"text":"Chóng mặt","children":[]},{"text":"Tim đập nhanh","children":[]}],"kind":"doctor"}],"keywords":"sản dịch, ra máu, băng huyết","audience":"me"},{"id":"B2","title":"Cương sữa","severity":["green"],"sections":[{"label":"Đây là gì","text":"Khoảng ngày 3-5 sau sinh, sữa về nhiều, máu và dịch dồn đến vú làm hai bầu vú căng cứng, nóng, nặng và đau. Quầng vú căng làm bé khó ngậm. Thường giảm sau 1-2 ngày, khi cơ thể điều chỉnh lượng sữa theo nhu cầu của bé.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Cho bé bú thường xuyên, 8-12 lần/ngày, kể cả ban đêm.","children":[]},{"text":"Nếu quầng vú căng cứng khiến bé không ngậm được: dùng các đầu ngón tay ấn nhẹ quanh quầng vú trong 1 phút cho mềm, hoặc vắt ra một ít sữa.","children":[]},{"text":"Cho bé bú.","children":[]},{"text":"Sau khi bú: chườm mát (khăn mát hoặc túi chườm bọc khăn) 10-15 phút để giảm sưng.","children":[]},{"text":"Massage rất nhẹ, kiểu vuốt da từ vú về phía nách.","children":[]},{"text":"Mặc áo ngực vừa vặn, không quá chật.","children":[]},{"text":"Đau nhiều: có thể dùng paracetamol hoặc ibuprofen (an toàn khi cho con bú).","children":[]}],"kind":"steps"},{"label":"Không nên","text":"vắt kiệt sữa quá mức (cơ thể sẽ tạo thêm sữa, càng cương hơn), day bóp mạnh.","items":[],"kind":"avoid"}],"keywords":"cương sữa, căng sữa, vú căng","audience":"me"},{"id":"B3","title":"Tắc tia sữa","severity":["yellow"],"sections":[{"label":"Đây là gì","text":"Một vùng trong vú bị sưng viêm, làm các ống dẫn sữa bị chèn hẹp, sữa ứ lại. Mẹ sờ thấy cục cứng hoặc mảng chắc, đau khi chạm, có khi da đỏ. Hay xảy ra khi bỏ cữ, bé bú không hết, áo chật đè vào vú. Nếu không xử lý có thể thành viêm vú hoặc áp xe.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Tiếp tục cho bú bình thường, kể cả bên bị tắc. Không ngừng cho bú.","children":[]},{"text":"Massage thật nhẹ như vuốt da, từ vùng vú bị tắc về phía nách. Không day mạnh vào cục cứng.","children":[]},{"text":"Chườm mát sau khi bú để giảm sưng và đau.","children":[]},{"text":"Đổi nhiều tư thế bú khác nhau.","children":[]},{"text":"Mặc áo rộng, tránh nằm sấp đè lên ngực, không đeo đai túi xách ngang ngực.","children":[]},{"text":"Dùng thuốc giảm đau nếu cần (paracetamol hoặc ibuprofen).","children":[]},{"text":"Nghỉ ngơi, uống đủ nước.","children":[]}],"kind":"steps"},{"label":"Không nên","text":"nhờ người day, lăn trứng, bóp mạnh vào cục tắc (làm tổn thương mô vú, dễ thành viêm).","items":[],"kind":"avoid"},{"label":"Đi khám khi","text":"","items":[{"text":"Sốt từ 38,5°C trở lên","children":[]},{"text":"Vùng đỏ lan rộng","children":[]},{"text":"Có cảm giác như bị cúm","children":[]},{"text":"Không đỡ sau 24-48 giờ","children":[]},{"text":"Có khối sưng mềm lùng nhùng (nghi áp xe)","children":[]}],"kind":"doctor"}],"keywords":"tắc sữa, tắc tia sữa, cục cứng, viêm vú","audience":"me"},{"id":"B4","title":"Nứt, đau đầu ti","severity":["yellow"],"sections":[{"label":"Đây là gì","text":"Đầu ti bị rát, đỏ, nứt nẻ, có khi chảy máu, đau nhất lúc bé mới ngậm. Nguyên nhân chính là khớp ngậm chưa đúng: bé chỉ ngậm đầu ti mà không ngậm sâu vào quầng vú, nên lợi bé nghiến lên đầu ti. Đau nhẹ vài giây đầu trong tuần đầu là phổ biến, nhưng đau suốt cữ bú là không bình thường.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Kiểm tra khớp ngậm của bé:","children":["Miệng bé mở rộng.","Ngậm cả phần lớn quầng vú, không chỉ đầu ti.","Môi dưới loe ra ngoài, cằm chạm vào vú.","Không nghe tiếng \"chụt chụt\" khi bú."]},{"text":"Bắt đầu cữ bú bằng bên ít đau hơn.","children":[]},{"text":"Khi muốn cho bé rời vú: đưa ngón tay út vào khóe miệng bé để mở khóa, không kéo đầu ti ra.","children":[]},{"text":"Sau khi bú: bôi vài giọt sữa mẹ hoặc kem lanolin lên đầu ti, để khô tự nhiên.","children":[]},{"text":"Đổi tư thế bú thường xuyên.","children":[]},{"text":"Nếu đau kéo dài: kiểm tra thắng lưỡi của bé.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Chảy máu kéo dài","children":[]},{"text":"Có mủ","children":[]},{"text":"Đau rát như kim châm (nghi nấm)","children":[]},{"text":"Không đỡ sau vài ngày","children":[]}],"kind":"doctor"}],"keywords":"nứt đầu ti, đau đầu ti, đau ti, khớp ngậm","audience":"me"},{"id":"B5","title":"Ít sữa","severity":["yellow"],"sections":[{"label":"Đây là gì","text":"Lượng sữa mẹ không đủ cho bé, thể hiện qua bé ít tã ướt và tăng cân chậm. Nhiều mẹ lo ít sữa vì vú mềm, bé đòi bú liên tục hoặc vắt ra được ít, nhưng những dấu hiệu này thường không có nghĩa là thiếu sữa. Cách đo đúng nhất là xem tã ướt và cân nặng của bé. Sữa tạo ra theo nguyên tắc: bú càng nhiều, sữa càng nhiều.","items":[],"kind":"about"},{"label":"Làm ngay","text":"","items":[{"text":"Cho bú hoặc vắt sữa 8-12 lần trong 24 giờ, kể cả ban đêm.","children":[]},{"text":"Da kề da với bé nhiều nhất có thể.","children":[]},{"text":"Mỗi cữ cho bú cả hai bên.","children":[]},{"text":"Sau khi bú, vắt thêm 10-15 phút bằng máy hoặc bằng tay.","children":[]},{"text":"Ăn đủ bữa, uống nước mỗi khi khát.","children":[]},{"text":"Ngủ khi con ngủ, nhờ người nhà làm việc nhà.","children":[]},{"text":"Theo dõi bé có đủ sữa không: từ ngày thứ 5, ít nhất 6 tã ướt/ngày, phân vàng, bé tăng cân đều.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Bé không tăng cân hoặc tăng cân chậm","children":[]},{"text":"Ít tã ướt","children":[]},{"text":"Bé ngủ li bì không đòi bú","children":[]}],"kind":"doctor"}],"keywords":"ít sữa, mất sữa, không đủ sữa, gọi sữa","audience":"me"},{"id":"B6","title":"Vết khâu tầng sinh môn","severity":["green"],"sections":[{"label":"Đây là gì","text":"Khi sinh thường, tầng sinh môn có thể bị rách, hoặc được bác sĩ cắt một đường nhỏ cho bé ra dễ, rồi khâu lại. Vết khâu thường đau, căng tức trong 1-2 tuần đầu. Chỉ khâu thường tự tiêu, không cần cắt chỉ.","items":[],"kind":"about"},{"label":"Chăm sóc hằng ngày","text":"","items":[{"text":"Sau mỗi lần đi vệ sinh, dội nước ấm sạch lên vùng khâu, lau từ trước ra sau, thấm khô.","children":[]},{"text":"24-48 giờ đầu: chườm lạnh (túi đá bọc khăn) 10-20 phút mỗi lần, vài lần/ngày.","children":[]},{"text":"Từ ngày thứ 2-3: ngâm vùng kín trong chậu nước ấm sạch 10-15 phút, 2-3 lần/ngày.","children":[]},{"text":"Ngồi trên gối mềm, tránh ngồi lâu một chỗ.","children":[]},{"text":"Thay băng vệ sinh thường xuyên.","children":[]},{"text":"Dùng thuốc giảm đau theo đơn bác sĩ.","children":[]},{"text":"Uống nhiều nước, ăn nhiều chất xơ để không bị táo bón.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Sưng đỏ tăng dần","children":[]},{"text":"Chảy mủ","children":[]},{"text":"Có mùi hôi","children":[]},{"text":"Vết khâu bị toác","children":[]},{"text":"Đau tăng thay vì giảm","children":[]},{"text":"Sốt","children":[]}],"kind":"doctor"}],"keywords":"vết khâu, tầng sinh môn, cắt tầng sinh môn","audience":"me"},{"id":"B7","title":"Vết mổ lấy thai","severity":["green"],"sections":[{"label":"Đây là gì","text":"Vết mổ thường là một đường ngang ở bụng dưới, dài khoảng 10-15 cm. Bên ngoài da lành trong khoảng 1-2 tuần, nhưng các lớp bên trong cần khoảng 6 tuần hoặc lâu hơn. Đau, tê quanh vết mổ, ngứa khi lên da non là bình thường.","items":[],"kind":"about"},{"label":"Chăm sóc hằng ngày","text":"","items":[{"text":"Giữ vết mổ khô sạch. Thay băng theo hướng dẫn của bác sĩ.","children":[]},{"text":"Tắm vòi sen khi bác sĩ cho phép, sau đó thấm khô vết mổ nhẹ nhàng.","children":[]},{"text":"Khi ho, hắt hơi, cười hoặc đứng dậy: ôm một chiếc gối áp vào bụng.","children":[]},{"text":"Đứng dậy theo cách: nghiêng người sang một bên, chống tay đẩy người lên.","children":[]},{"text":"Đi lại nhẹ nhàng sớm để phòng huyết khối.","children":[]},{"text":"Không bê vật nặng hơn em bé trong 6 tuần đầu.","children":[]},{"text":"Mặc quần áo rộng, cạp quần không cọ vào vết mổ.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Vết mổ đỏ, sưng, nóng","children":[]},{"text":"Chảy dịch hoặc mủ","children":[]},{"text":"Toác vết mổ","children":[]},{"text":"Đau tăng dần","children":[]},{"text":"Sốt","children":[]}],"kind":"doctor"}],"keywords":"vết mổ, mổ đẻ, sinh mổ","audience":"me"},{"id":"B8","title":"Buồn bã sau sinh, trầm cảm sau sinh","severity":["green","red"],"sections":[{"label":"Đây là gì","text":"Buồn bã sau sinh (baby blues) là cảm giác dễ khóc, buồn vô cớ, cáu gắt, lo âu trong khoảng 2 tuần đầu, gặp ở phần lớn các mẹ, do hormone thay đổi đột ngột và thiếu ngủ. Trầm cảm sau sinh nặng hơn và kéo dài hơn: buồn chán, mất hứng thú, thấy mình tội lỗi hoặc vô dụng suốt nhiều tuần, ảnh hưởng đến việc chăm con. Đây là bệnh, chữa được, không phải do mẹ yếu đuối.","items":[],"kind":"about"},{"label":"Mẹ có thể làm","text":"","items":[{"text":"Ngủ khi con ngủ. Nhờ người trông bé để có ít nhất một giấc ngủ dài 4-5 giờ mỗi ngày.","children":[]},{"text":"Nói ra cảm xúc của mình với chồng, người thân hoặc bạn bè.","children":[]},{"text":"Ăn đủ bữa, ra ngoài đi dạo, hít thở không khí ngoài trời mỗi ngày.","children":[]},{"text":"Giảm bớt việc nhà, chấp nhận \"không hoàn hảo\".","children":[]},{"text":"Gặp gỡ những người mẹ khác.","children":[]}],"kind":"steps"},{"label":"Người nhà nên làm","text":"","items":[{"text":"Chủ động nhận việc: thay tã, ru bé, làm việc nhà, nấu ăn.","children":[]},{"text":"Lắng nghe, không phán xét, không so sánh \"ngày xưa ai cũng vậy\".","children":[]},{"text":"Để ý các dấu hiệu: buồn kéo dài trên 2 tuần, mất hứng thú, khóc nhiều, mất ngủ dù bé đã ngủ, thấy mình là người mẹ tồi, khó gắn bó với con.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Các dấu hiệu trên kéo dài quá 2 tuần hoặc ngày càng nặng","children":[]}],"kind":"doctor"},{"label":"🔴 Cấp cứu ngay khi","text":"mẹ có ý nghĩ làm hại bản thân hoặc con: không để mẹ ở một mình, đặt bé ở nơi an toàn, gọi người thân và đưa mẹ đến cơ sở y tế ngay.","items":[],"kind":"doctor"}],"keywords":"trầm cảm, buồn, baby blues, khóc, stress","audience":"me"},{"id":"B9","title":"Táo bón, trĩ sau sinh","severity":["green","yellow"],"sections":[{"label":"Đây là gì","text":"Sau sinh ruột hoạt động chậm lại, mẹ sợ đau vết khâu nên ngại đi ngoài, cộng thêm thuốc giảm đau và uống ít nước, nên dễ táo bón. Trĩ là các tĩnh mạch ở hậu môn bị sưng phồng do rặn khi sinh hoặc khi táo bón, gây đau, ngứa, có thể chảy ít máu đỏ tươi khi đi ngoài.","items":[],"kind":"about"},{"label":"Làm","text":"","items":[{"text":"Uống 2-2,5 lít nước/ngày.","children":[]},{"text":"Ăn nhiều rau xanh, trái cây, ngũ cốc nguyên hạt.","children":[]},{"text":"Đi lại nhẹ nhàng mỗi ngày.","children":[]},{"text":"Đi vệ sinh ngay khi buồn, không nhịn, không rặn mạnh.","children":[]},{"text":"Kê một chiếc ghế nhỏ dưới chân khi ngồi bồn cầu.","children":[]},{"text":"Với trĩ: ngâm hậu môn trong nước ấm 10-15 phút, vài lần/ngày.","children":[]}],"kind":"steps"},{"label":"Đi khám khi","text":"","items":[{"text":"Đau nhiều","children":[]},{"text":"Chảy máu nhiều","children":[]},{"text":"Trên 4 ngày không đi ngoài được","children":[]}],"kind":"doctor"}],"keywords":"táo bón, trĩ","audience":"me"}],"emergency":[{"title":"Bé","sections":[{"label":null,"text":"","items":[{"text":"Sốt từ 38°C trở lên ở bé dưới 3 tháng","children":[]},{"text":"Thở nhanh trên 60 lần/phút, rút lõm ngực, cánh mũi phập phồng, môi tím","children":[]},{"text":"Ngưng thở trên 20 giây","children":[]},{"text":"Li bì, khó đánh thức, người mềm nhũn","children":[]},{"text":"Co giật","children":[]},{"text":"Bỏ bú, bú rất kém","children":[]},{"text":"Nôn vọt, nôn ra dịch xanh hoặc có máu","children":[]},{"text":"Phân bạc màu (trắng, xám), phân có máu","children":[]},{"text":"Vàng da trong 24 giờ đầu, hoặc vàng lan xuống lòng bàn tay, bàn chân","children":[]},{"text":"Có từ 2 dấu hiệu mất nước trở lên","children":[]},{"text":"Thóp phồng","children":[]},{"text":"Ngã đập đầu kèm nôn, li bì, ngất","children":[]},{"text":"Hóc dị vật","children":[]}],"kind":"info"}]},{"title":"Mẹ","sections":[{"label":null,"text":"","items":[{"text":"Thấm đẫm 1 băng vệ sinh trong 1 giờ, ra cục máu lớn","children":[]},{"text":"Đau đầu dữ dội, mờ mắt, phù nhanh (nghi tiền sản giật, có thể xảy ra đến 6 tuần sau sinh)","children":[]},{"text":"Đau ngực, khó thở đột ngột","children":[]},{"text":"Bắp chân sưng, đau một bên","children":[]},{"text":"Sốt cao kèm sản dịch hôi","children":[]},{"text":"Có ý nghĩ làm hại bản thân hoặc con","children":[]}],"kind":"info"}]}],"glossary":[{"term":"Thóp","aliases":["Thóp"],"text":"Chỗ mềm trên đỉnh đầu bé, nơi các xương sọ chưa liền lại, thường liền hẳn khi bé 12-18 tháng. Bình thường thóp phẳng. Thóp lõm xuống có thể do mất nước, thóp phồng căng có thể do áp lực trong đầu tăng, cả hai đều cần đi khám."},{"term":"Li bì","aliases":["Li bì"],"text":"Bé ngủ nhiều bất thường, lay gọi khó tỉnh, tỉnh rồi lại lơ mơ ngủ tiếp, không đòi bú, người mềm yếu. Khác với ngủ ngon: bé ngủ ngon vẫn tự thức dậy đòi bú."},{"term":"Tím tái","aliases":["Tím tái","tím môi","tím"],"text":"Môi, lưỡi, mặt hoặc toàn thân chuyển màu xanh tím do máu thiếu oxy. Bàn tay, bàn chân hơi tím khi lạnh trong những ngày đầu có thể bình thường, nhưng tím ở môi, lưỡi, mặt luôn là dấu hiệu nguy hiểm."},{"term":"Rút lõm ngực","aliases":["Rút lõm ngực","lõm ngực"],"text":"Khi bé hít vào, phần da ngay dưới bờ sườn hoặc giữa các xương sườn bị hút lõm sâu vào trong. Cho thấy bé đang phải gắng sức rất nhiều để thở."},{"term":"Cánh mũi phập phồng","aliases":["Cánh mũi phập phồng","phập phồng cánh mũi"],"text":"Hai bên cánh mũi phồng ra xẹp vào theo từng nhịp thở, là dấu hiệu bé đang khó thở."},{"term":"Thở nhanh","aliases":["Thở nhanh"],"text":"Nhịp thở vượt mức bình thường theo tuổi: từ 60 lần/phút trở lên với bé dưới 2 tháng, từ 50 lần/phút trở lên với bé 2-12 tháng. Phải đếm đủ 60 giây khi bé nằm yên."},{"term":"Khò khè","aliases":["Khò khè"],"text":"Tiếng thở rè rè, rít như có đờm hoặc như huýt sáo nhỏ khi bé thở."},{"term":"Ngưng thở","aliases":["Ngưng thở","ngừng thở"],"text":"Bé không thở trong một khoảng. Trẻ sơ sinh có thể ngừng vài giây rồi thở lại (thở chu kỳ), là bình thường. Ngừng trên 20 giây, hoặc ngừng kèm tím tái, mềm nhũn là cấp cứu."},{"term":"Co giật","aliases":["Co giật"],"text":"Bé giật tay chân nhịp nhàng không dừng được, hoặc người cứng đờ, mắt trợn hay nhìn chằm chằm một hướng, môi chép liên tục, gọi không đáp. Khác với run sinh lý: run sinh lý dừng ngay khi giữ nhẹ tay chân bé."},{"term":"Mất nước","aliases":["Mất nước"],"text":"Cơ thể thiếu nước do mất nhiều (nôn, tiêu chảy, sốt) mà không được bù đủ. Dấu hiệu: ít tã ướt, môi khô, thóp lõm, khóc không có nước mắt, li bì."},{"term":"Nhiễm trùng","aliases":["Nhiễm trùng"],"text":"Vi khuẩn hoặc virus xâm nhập và gây bệnh. Ở trẻ sơ sinh, nhiễm trùng có thể lan nhanh vào máu, nên các dấu hiệu như sốt, hạ thân nhiệt, bỏ bú, li bì đều cần đi khám sớm."},{"term":"Hẹp môn vị","aliases":["Hẹp môn vị"],"text":"Môn vị là cửa ra của dạ dày xuống ruột. Ở một số bé (thường 2-8 tuần tuổi), cơ ở đây dày lên chặn sữa đi xuống, khiến bé nôn vọt sau bú. Chữa bằng một ca mổ nhỏ, hiệu quả cao."},{"term":"Dịch xanh","aliases":["Dịch xanh"],"text":"Chất nôn màu xanh lá cây, màu của mật. Có thể là dấu hiệu tắc ruột, cần đi khám ngay."},{"term":"Tắc ruột","aliases":["Tắc ruột"],"text":"Ruột bị chặn, thức ăn và hơi không đi xuống được, gây nôn ra dịch xanh, bụng chướng, đau. Là cấp cứu ngoại khoa."},{"term":"Phân bạc màu","aliases":["Phân bạc màu"],"text":"Phân trắng, xám hoặc vàng rất nhạt như màu đất sét. Có thể là dấu hiệu teo đường mật, cần đi khám ngay."},{"term":"Teo đường mật","aliases":["Teo đường mật"],"text":"Đường dẫn mật từ gan xuống ruột bị tắc hoặc không phát triển. Cần phát hiện và mổ sớm, tốt nhất trước khi bé 2 tháng tuổi."},{"term":"Bilirubin","aliases":["Bilirubin"],"text":"Chất màu vàng sinh ra khi hồng cầu cũ bị phân huỷ. Gan lọc chất này và thải ra ngoài qua phân. Bilirubin tăng cao gây vàng da."},{"term":"Cơ hoành","aliases":["Cơ hoành"],"text":"Lớp cơ mỏng ngăn giữa ngực và bụng, giúp ta hít thở."},{"term":"Phản xạ Moro","aliases":["Phản xạ Moro"],"text":"Phản xạ giật mình bẩm sinh: khi bị giật mình hoặc có cảm giác bị rơi, bé dang hai tay ra rồi co lại, có khi khóc. Thường hết khi bé 3-6 tháng."},{"term":"Lẫy","aliases":["Lẫy"],"text":"Bé tự lật từ nằm ngửa sang nằm sấp. Thường bắt đầu khoảng 3-5 tháng, có bé sớm hơn."},{"term":"Đột tử","aliases":["Đột tử"],"text":"Ở đây là hội chứng đột tử ở trẻ sơ sinh: bé đang khỏe mạnh tử vong đột ngột khi ngủ mà không rõ nguyên nhân, hay gặp nhất ở bé dưới 6 tháng. Cho bé ngủ nằm ngửa trên nệm phẳng, không gối, không chăn dày giúp giảm nguy cơ rõ rệt."},{"term":"Dị vật","aliases":["Dị vật"],"text":"Vật lạ lọt vào đường thở, như hạt, đồ chơi nhỏ, miếng thức ăn, cục sữa."},{"term":"Hồi sinh tim phổi","aliases":["Hồi sinh tim phổi"],"text":"Còn gọi là CPR: ép tim và thổi ngạt để duy trì máu và oxy lên não khi tim hoặc hơi thở ngừng. Nên học trực tiếp tại một lớp sơ cứu."},{"term":"Da kề da","aliases":["Da kề da"],"text":"Đặt bé chỉ mặc tã nằm sấp áp trực tiếp lên ngực trần của bố hoặc mẹ, đắp chăn lên cả hai. Giúp giữ ấm cho bé, ổn định nhịp tim, nhịp thở và giúp sữa về."},{"term":"Tiếng ồn trắng","aliases":["Tiếng ồn trắng"],"text":"Âm thanh rì rì đều đều như tiếng quạt, máy sấy, tiếng mưa. Giống tiếng bé nghe trong bụng mẹ nên giúp bé dễ dịu lại."},{"term":"Dạ đề","aliases":["Dạ đề"],"text":"Cách gọi dân gian cho tình trạng bé khóc rất nhiều, khó dỗ, thường vào chiều tối, ở bé khỏe mạnh 2 tuần đến 4 tháng tuổi."},{"term":"Nước muối sinh lý","aliases":["Nước muối sinh lý"],"text":"Nước muối 0,9%, độ mặn giống dịch cơ thể, bán sẵn ở hiệu thuốc. Dùng nhỏ mũi, rửa mắt, rửa rốn. Không tự pha ở nhà."},{"term":"ORS","aliases":["ORS"],"text":"Oresol, gói bột muối và đường để pha với nước theo tỉ lệ chính xác, dùng bù nước khi tiêu chảy, nôn. Pha sai tỉ lệ có thể gây hại."},{"term":"Kẽm oxit","aliases":["Kẽm oxit"],"text":"Thành phần chính trong nhiều kem chống hăm, tạo lớp màng bảo vệ da khỏi nước tiểu và phân."},{"term":"Corticoid","aliases":["Corticoid"],"text":"Nhóm thuốc chống viêm mạnh, có trong nhiều loại kem bôi da. Bôi sai cách trên da bé (bôi lâu, bôi rộng) có thể làm mỏng da và gây tác dụng phụ. Chỉ dùng khi bác sĩ kê."},{"term":"Paracetamol","aliases":["Paracetamol"],"text":"Thuốc hạ sốt, giảm đau phổ biến nhất cho trẻ em, còn gọi là acetaminophen. Liều tính theo cân nặng của bé, phải đo đúng bằng dụng cụ kèm theo chai thuốc."},{"term":"Ibuprofen","aliases":["Ibuprofen"],"text":"Thuốc hạ sốt, giảm đau, chống viêm. Không dùng cho bé dưới 6 tháng. Mẹ đang cho con bú dùng được."},{"term":"Aspirin","aliases":["Aspirin"],"text":"Thuốc giảm đau, hạ sốt. Không bao giờ dùng cho trẻ em vì có thể gây hội chứng Reye, làm tổn thương gan và não."},{"term":"Lanolin","aliases":["Lanolin"],"text":"Chất béo tinh chế từ lông cừu, dạng kem bôi đầu ti, giúp giữ ẩm cho vết nứt mau lành. Không cần lau đi trước khi cho bú."},{"term":"Thuốc co mạch","aliases":["Thuốc co mạch"],"text":"Thuốc nhỏ mũi làm co mạch máu trong mũi để thông mũi nhanh. Không dùng cho trẻ nhỏ vì có thể gây ngộ độc, làm bé thở chậm, li bì."},{"term":"Vaselin","aliases":["Vaselin"],"text":"Sáp trơn, không mùi, bán ở hiệu thuốc. Ở đây dùng bôi vào đầu nhiệt kế cho dễ đưa vào hậu môn."},{"term":"Loạn sản khớp háng","aliases":["Loạn sản khớp háng"],"text":"Khớp háng phát triển không bình thường, chỏm xương đùi lỏng hoặc trật ra khỏi ổ khớp. Quấn chặt và ép thẳng hai chân bé làm tăng nguy cơ."},{"term":"Bọng nước","aliases":["Bọng nước"],"text":"Bóng nước phồng trên da sau khi bị bỏng. Lớp da phía trên che chở vết thương bên dưới, nên không chọc vỡ."},{"term":"Khớp ngậm","aliases":["Khớp ngậm"],"text":"Cách miệng bé bám vào vú khi bú. Ngậm đúng là miệng mở rộng, ngậm cả phần lớn quầng vú, môi dưới loe ra ngoài, cằm chạm vú."},{"term":"Quầng vú","aliases":["Quầng vú"],"text":"Vùng da sẫm màu bao quanh đầu ti."},{"term":"Thắng lưỡi","aliases":["Thắng lưỡi"],"text":"Dải da mỏng nối mặt dưới lưỡi với sàn miệng. Nếu quá ngắn hoặc quá dày, bé khó đưa lưỡi ra để bú, làm mẹ đau đầu ti."},{"term":"Nấm","aliases":["Nấm"],"text":"Ở đây là nấm Candida, một loại nấm men vốn sống trên da và trong miệng, phát triển quá mức khi gặp chỗ ẩm và ấm, gây tưa lưỡi, hăm nấm, đau rát đầu ti."},{"term":"Tầng sinh môn","aliases":["Tầng sinh môn"],"text":"Vùng da và cơ nằm giữa cửa âm đạo và hậu môn."},{"term":"Sản dịch","aliases":["Sản dịch"],"text":"Máu và dịch chảy ra từ tử cung qua âm đạo sau sinh, kéo dài khoảng 4-6 tuần."},{"term":"Băng huyết","aliases":["Băng huyết"],"text":"Chảy máu rất nhiều sau sinh, có thể nguy hiểm đến tính mạng. Hay gặp nhất trong 24 giờ đầu nhưng có thể xảy ra đến vài tuần sau."},{"term":"Tiền sản giật","aliases":["Tiền sản giật"],"text":"Bệnh tăng huyết áp liên quan đến thai kỳ, có thể xuất hiện cả sau sinh (đến 6 tuần). Dấu hiệu: đau đầu dữ dội, mờ mắt, phù nhanh. Có thể gây co giật, đột quỵ."},{"term":"Huyết khối","aliases":["Huyết khối"],"text":"Cục máu đông trong lòng mạch máu, sau sinh hay gặp ở chân. Nếu cục máu trôi lên phổi có thể gây khó thở, đau ngực đột ngột, rất nguy hiểm."},{"term":"Viêm vú","aliases":["Viêm vú"],"text":"Vú bị viêm, có thể do nhiễm khuẩn, gây đỏ, nóng, đau, kèm sốt, ớn lạnh, mệt như bị cúm."},{"term":"Áp xe","aliases":["Áp xe"],"text":"Ổ mủ dưới da hoặc trong mô, sờ thấy khối sưng mềm, lùng nhùng, đau. Thường phải được bác sĩ chích hoặc hút mủ."},{"term":"Trĩ","aliases":["Trĩ"],"text":"Các tĩnh mạch ở hậu môn bị sưng phồng, gây đau, ngứa, có thể chảy máu đỏ tươi khi đi ngoài."}],"categories":[{"id":"an-uong","icon":"🍼","title":"Ăn uống, tiêu hóa","items":["A1","A2","A3","A4","A5","A6","A7","A8"]},{"id":"da","icon":"🧴","title":"Da, rốn, cơ thể","items":["A9","A10","A11","A12","A13","A14","A15","A23"]},{"id":"ho-hap","icon":"🫁","title":"Hô hấp","items":["A16","A3"]},{"id":"sot","icon":"🌡️","title":"Sốt, thân nhiệt","items":["A17","A18"]},{"id":"ngu","icon":"😴","title":"Ngủ, khóc","items":["A6","A19","A20"]},{"id":"mat-mieng","icon":"👁️","title":"Mắt, miệng","items":["A21","A22"]},{"id":"tai-nan","icon":"⚠️","title":"Tai nạn","items":["A24","A25","A3"]},{"id":"me","icon":"👩","title":"Mẹ sau sinh","items":["B1","B2","B3","B4","B5","B6","B7","B8","B9"]}]}</script>
<script>
window.APP_VERSION = "616a595946";
(function () {
  "use strict";

  /* ============================================================
     Dữ liệu
     ============================================================ */
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SIT = {}, SKILL = {}, CAT = {};
  DATA.situations.forEach(function (s) { SIT[s.id] = s; });
  DATA.skills.forEach(function (k) { SKILL[k.id] = k; });
  DATA.categories.forEach(function (c) { CAT[c.id] = c; });

  // Từ điển: mỗi từ (kể cả tên gọi khác) trỏ về một mục giải thích
  var GLOSS = DATA.glossary || [];
  var TERM_IDX = {};
  var aliases = [];
  GLOSS.forEach(function (g, i) {
    g.aliases.forEach(function (a) { TERM_IDX[a.toLowerCase()] = i; aliases.push(a); });
  });
  aliases.sort(function (a, b) { return b.length - a.length; });
  var TERM_RE = null;
  try {
    TERM_RE = new RegExp("(?<![\\p{L}\\d])(" + aliases.map(function (a) {
      return a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("|") + ")(?![\\p{L}\\d])", "giu");
  } catch (e) { TERM_RE = null; }   // trình duyệt quá cũ: bỏ qua gạch chân
  var termSeen = {};      // mỗi trang chỉ gạch chân lần xuất hiện đầu tiên của một từ
  var termSkip = -1;      // không gạch chân từ trùng với chính trang đang xem

  var SEV_LABEL = { green: "Thường gặp", yellow: "Cần lưu ý", red: "Nguy hiểm" };
  var CHECK_TTL = 12 * 3600 * 1000;   // checklist tự xoá sau 12 giờ

  /* ============================================================
     Lưu trữ an toàn (trình duyệt riêng tư có thể chặn)
     ============================================================ */
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ============================================================
     Tiện ích
     ============================================================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(s) { return String(s).replace(/\*\*/g, ""); }

  function refChip(id) {
    if (SKILL[id]) return '<button class="ref" data-skill="' + id + '">' + esc(SKILL[id].short) + "</button>";
    if (SIT[id]) return '<a class="ref" href="#/t/' + id + '">' + esc(SIT[id].title) + "</a>";
    return id;
  }
  // **đậm**, "(xem K1)", "(K5)", "theo K2" thành chip bấm được
  function fmt(s) {
    var h = esc(s);
    if (TERM_RE) {
      h = h.replace(TERM_RE, function (m) {
        var i = TERM_IDX[m.toLowerCase()];
        if (i == null || i === termSkip || termSeen[i]) return m;
        termSeen[i] = 1;
        return '<button class="term" data-term="' + i + '">' + m + "</button>";
      });
    }
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\s?\((?:xem )?([AKB]\d{1,2})\)/g, function (_, id) { return " " + refChip(id); });
    h = h.replace(/\b(theo|xem) ([AKB]\d{1,2})\b/g, function (_, w, id) { return w + " " + refChip(id); });
    return h;
  }

  // Bỏ dấu tiếng Việt, giữ nguyên độ dài từng ký tự để còn tô sáng được
  function normChar(c) {
    if (c === "đ" || c === "Đ") return "d";
    var n = c.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return (n.length === 1 ? n : c).toLowerCase();
  }
  function norm(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) out += normChar(s[i]);
    return out;
  }

  var ICON = {
    chev: '<svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    tw: '<svg class="tw" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.6 3.5l2.6-.3 1.6 4.3-2 1.5a12 12 0 0 0 6.2 6.2l1.5-2 4.3 1.6-.3 2.6a2.5 2.5 0 0 1-2.6 2.1C10.4 21 3 13.6 4.5 6.1a2.5 2.5 0 0 1 2.1-2.6z" fill="currentColor"/></svg>',
    alert: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5l9 16H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>',
    search: '<svg class="s-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',

    doctor: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="currentColor"/></svg>',
    info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.5" fill="currentColor"/></svg>'
  };

  function dots(sev) {
    return '<span class="dots" aria-hidden="true">' +
      sev.map(function (c) { return '<span class="dot ' + c + '"></span>'; }).join("") + "</span>";
  }
  function sevNote(sev) {
    var g = sev.indexOf("green") > -1, y = sev.indexOf("yellow") > -1, r = sev.indexOf("red") > -1;
    if (r && !g && !y) return "Cần đi khám ngay.";
    if (r && g) return "Thường không nguy hiểm, nhưng có trường hợp phải đi cấp cứu.";
    if (r) return "Có thể nguy hiểm. Đọc kỹ các dấu hiệu phải đi khám.";
    if (y && g) return "Thường xử lý được tại nhà, đôi khi cần hỏi bác sĩ.";
    if (y) return "Nên hỏi bác sĩ nếu không đỡ sau 24-48 giờ.";
    return "Thường gặp, chăm sóc được tại nhà.";
  }
  function sevA11y(sev) { return sev.map(function (c) { return SEV_LABEL[c]; }).join(" đến "); }

  /* ============================================================
     Checklist: đánh dấu từng bước đã làm
     ============================================================ */
  function checkKey(id) { return "xltn-check-" + id; }
  function loadCheck(id) {
    var c = store.get(checkKey(id), null);
    if (!c || Date.now() - c.ts > CHECK_TTL) return { ts: 0, done: {} };
    return c;
  }
  function saveCheck(id, c) {
    if (Object.keys(c.done).length) store.set(checkKey(id), c);
    else store.del(checkKey(id));
  }
  function timeStr(ts) {
    var d = new Date(ts);
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function renderSteps(ownerId, sec, si, check) {
    var total = sec.items.length;
    var n = 0;
    var lis = sec.items.map(function (it, i) {
      var key = si + "-" + i;
      var done = !!check.done[key];
      if (done) n++;
      var sub = "";
      if (it.children.length) {
        var ol = /^\d/.test(it.children[0]) ? "" : "";
        sub = '<ul class="sub' + ol + '">' + it.children.map(function (c) {
          return "<li>" + fmt(c) + "</li>";
        }).join("") + "</ul>";
      }
      return '<li class="step' + (done ? " done" : "") + '" data-owner="' + ownerId + '" data-key="' + key +
        '" role="checkbox" aria-checked="' + done + '" tabindex="0">' +
        '<span class="step-n"><span>' + (i + 1) + "</span>" + ICON.check + "</span>" +
        '<div class="step-body"><div class="step-text">' + fmt(it.text) + "</div>" + sub + "</div></li>";
    }).join("");
    var label = sec.label || "Các bước";
    return '<section class="block k-steps" data-sec="' + si + '">' +
      '<div class="block-head"><h2>' + esc(label) + "</h2>" +
      '<span class="progress' + (n === total ? " done" : "") + '" data-progress="' + si + '">' + n + "/" + total + "</span></div>" +
      '<ol class="steps">' + lis + "</ol></section>";
  }

  function renderOther(sec, opts) {
    var kind = sec.kind;
    var open = kind !== "prevent" || opts.openAll;
    var label = sec.label || "Ghi chú";
    var body = "";
    if (sec.text) body += '<p class="ptext">' + fmt(sec.text) + "</p>";
    if (sec.items.length) {
      body += '<ul class="blist">' + sec.items.map(function (it) {
        var sub = it.children.length ? '<ul class="sub">' + it.children.map(function (c) {
          return "<li>" + fmt(c) + "</li>"; }).join("") + "</ul>" : "";
        return "<li>" + fmt(it.text) + sub + "</li>";
      }).join("") + "</ul>";
    }
    if (kind === "doctor" && opts.call) {
      body += '<a class="btn danger big call" href="tel:115">' + ICON.phone + "Gọi cấp cứu 115</a>";
    }
    return '<details class="block k-' + kind + '"' + (open ? " open" : "") +
      (kind === "doctor" ? ' id="kham"' : "") + "><summary>" +
      '<span class="k-ico">' + (ICON[kind] || ICON.info) + "</span><h2>" + esc(label) + "</h2>" + ICON.tw +
      "</summary>" + body + "</details>";
  }

  function renderItemBody(item, opts) {
    opts = opts || {};
    var check = loadCheck(item.id);
    var hasRed = (item.severity || []).indexOf("red") > -1;
    var html = "";
    var stepSecs = 0;
    item.sections.forEach(function (sec, si) {
      if (sec.kind === "about") return;   // phần "Đây là gì" hiện riêng ở đầu trang
      if (sec.kind === "steps") {
        stepSecs++;
        html += renderSteps(item.id, sec, si, check);
      } else {
        html += renderOther(sec, { call: hasRed || /cấp cứu/i.test(sec.label || ""), openAll: opts.openAll });
      }
    });
    (item.notes || []).forEach(function (n) {
      html += '<div class="note">' + ICON.info.replace("<svg ", '<svg width="20" height="20" style="flex:none;margin-top:2px" ') +
        "<div>" + fmt(n) + "</div></div>";
    });
    var bar = "";
    if (stepSecs) {
      bar = '<div class="since" data-since="' + item.id + '">' + sinceText(check) + "</div>";
    }
    return bar + html;
  }
  function sinceText(check) {
    if (!check.ts || !Object.keys(check.done).length) {
      return "Chạm vào từng bước để đánh dấu đã làm. Chạm vào <span class=\"term-demo\">chữ gạch chân</span> để xem nghĩa.";
    }
    return 'Đánh dấu từ lúc ' + timeStr(check.ts) + ' · <button class="reset" data-reset>Làm lại từ đầu</button>';
  }

  function toggleStep(el) {
    var owner = el.getAttribute("data-owner"), key = el.getAttribute("data-key");
    var c = loadCheck(owner);
    var on = !c.done[key];
    if (on) { c.done[key] = 1; if (!c.ts) c.ts = Date.now(); }
    else delete c.done[key];
    if (!Object.keys(c.done).length) c.ts = 0;
    saveCheck(owner, c);
    el.classList.toggle("done", on);
    el.setAttribute("aria-checked", on);
    if (on && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    refreshProgress(el.closest(".block"), owner);
  }
  function refreshProgress(block, owner) {
    if (!block) return;
    var all = block.querySelectorAll(".step").length;
    var n = block.querySelectorAll(".step.done").length;
    var p = block.querySelector(".progress");
    if (p) { p.textContent = n + "/" + all; p.classList.toggle("done", n === all); }
    var root = block.parentNode;
    var since = root.querySelector('[data-since="' + owner + '"]');
    if (since) since.innerHTML = sinceText(loadCheck(owner));
  }

  /* ============================================================
     Tìm kiếm
     ============================================================ */
  var INDEX = [];
  function bodyText(item) {
    var parts = [];
    item.sections.forEach(function (s) {
      if (s.label) parts.push(s.label);
      if (s.text) parts.push(s.text);
      s.items.forEach(function (it) { parts.push(it.text); parts = parts.concat(it.children); });
    });
    return plain(parts.join(" · ")).replace(/\(xem [AKB]\d+\)|\([AKB]\d+\)/g, "");
  }
  function buildIndex() {
    DATA.situations.concat(DATA.skills).forEach(function (it) {
      var body = bodyText(it);
      INDEX.push({ item: it, t: norm(it.title), k: norm(it.keywords || ""), b: norm(body), body: body });
    });
    GLOSS.forEach(function (g, i) {
      var item = { id: "G" + i, title: g.term, gloss: i };
      INDEX.push({ item: item, t: norm(g.term), k: norm(g.aliases.join(", ")), b: norm(g.text), body: g.text });
    });
  }
  // vị trí đầu tiên mà t khớp ở đầu một từ ("ho" khớp "ho khan", không khớp "hơi")
  // từ ngắn 1-2 chữ phải khớp trọn từ, nếu không "ho" sẽ khớp cả "hơi"
  function wordAt(text, t) {
    var whole = t.length <= 2;
    var i = text.indexOf(t);
    while (i > -1) {
      var startOk = i === 0 || !/[a-z0-9]/.test(text[i - 1]);
      var endOk = !whole || !/[a-z0-9]/.test(text[i + t.length] || "");
      if (startOk && endOk) return i;
      i = text.indexOf(t, i + 1);
    }
    return -1;
  }
  function search(q) {
    var nq = norm(q.trim()).replace(/\s+/g, " ");
    if (!nq) return [];
    var toks = nq.split(" ").filter(Boolean);
    var res = [];
    INDEX.forEach(function (d) {
      var score = 0, ok = true;
      toks.forEach(function (t) {
        var s = 0;
        if (wordAt(d.t, t) > -1) s += 12;
        if (wordAt(d.k, t) > -1) s += 7;
        if (wordAt(d.b, t) > -1) s += 1;
        if (!s) ok = false;
        score += s;
      });
      if (!ok) return;
      if (toks.length > 1) {
        if (wordAt(d.t, nq) > -1) score += 20;
        if (wordAt(d.k, nq) > -1) score += 12;
        if (wordAt(d.b, nq) > -1) score += 3;
      }
      if (d.item.id[0] === "K") score -= 2;
      if (d.item.id[0] === "G") score -= 1;
      res.push({ d: d, score: score, toks: toks, nq: nq });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    return res.slice(0, 30);
  }
  function snippet(r) {
    var d = r.d;
    var needle = wordAt(d.b, r.nq) > -1 ? r.nq : null;
    if (!needle) {
      for (var i = 0; i < r.toks.length; i++) if (wordAt(d.b, r.toks[i]) > -1) { needle = r.toks[i]; break; }
    }
    var at = needle ? wordAt(d.b, needle) : -1;
    if (at < 0) return d.item.severity && d.item.severity.length ? esc(sevNote(d.item.severity)) : "Kỹ năng cơ bản";
    var start = Math.max(0, at - 36);
    var end = Math.min(d.body.length, at + needle.length + 70);
    // cắt ở ranh giới từ cho gọn
    if (start > 0) { var sp = d.body.indexOf(" ", start); if (sp > -1 && sp < at) start = sp + 1; }
    return (start > 0 ? "…" : "") + esc(d.body.slice(start, at)) + "<mark>" + esc(d.body.slice(at, at + needle.length)) +
      "</mark>" + esc(d.body.slice(at + needle.length, end)) + (end < d.body.length ? "…" : "");
  }

    return '<a class="row" href="' + href + '"' + (isSkill ? "" : ' aria-label="' + esc(it.title + ", " + sevA11y(it.severity)) + '"') + ">" +
      lead + '<span class="row-main"><span class="row-title">' + esc(it.title) + "</span>" +
