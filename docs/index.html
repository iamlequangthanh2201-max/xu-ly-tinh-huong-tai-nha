hòng tối"},{"who":"Bố","text":"nhận dỗ đêm thứ Sáu, thứ Bảy"}]}],"nightTips":["Không cho bé ngậm bình sữa khi ngủ để tránh sâu răng."],"milk":[{"t":"06:30","k":"bu","text":"Cho bú trực tiếp","parts":[{"who":null,"text":"Cho bú trực tiếp"}]},{"t":"13:00","k":"hut","text":"Hút khi đi làm, nếu cần","parts":[{"who":null,"text":"Hút khi đi làm, nếu cần"}]},{"t":"18:50","k":"bu","text":"Cho bú trực tiếp","parts":[{"who":null,"text":"Cho bú trực tiếp"}]}],"milkNotes":[],"notes":["Tập cho bé uống sữa bằng cốc để chuẩn bị bỏ bình sau 1 tuổi."]},{"key":"12","big":"12","small":"tháng","sub":"1 tuổi","summary":[{"label":"Cách cho ăn","value":"3 bữa chính, 2 bữa phụ; bú mẹ sáng, tối nếu mẹ muốn tiếp tục"},{"label":"Sữa","value":"2-3 lần/ngày, khoảng 400-500 ml"},{"label":"Thức mỗi lần","value":"3 giờ 15-4 giờ"},{"label":"Giấc ngày","value":"2 giấc (một số bé chuyển sang 1 giấc trưa)"},{"label":"Tổng giờ ngủ","value":"11-14 giờ/ngày"},{"label":"Ngủ đêm","value":"khoảng 19:30, không bú đêm"},{"label":"Nhịp làm trống vú","value":"Theo nhu cầu, giảm dần nếu muốn cai"}],"baby":[{"t":"06:30","k":"bu","text":"Thức dậy, thay tã, bú mẹ, chải răng","parts":[{"who":null,"text":"Thức dậy, thay tã, bú mẹ, chải răng"}]},{"t":"07:30","k":"an","text":"Bữa sáng cùng gia đình","parts":[{"who":null,"text":"Bữa sáng cùng gia đình"}]},{"t":"08:00","k":"choi","text":"Tập đi, xếp khối, chơi đồ chơi đẩy kéo","parts":[{"who":null,"text":"Tập đi, xếp khối, chơi đồ chơi đẩy kéo"}]},{"t":"10:15","k":"ngu","text":"Giấc ngày 1","parts":[{"who":null,"text":"Giấc ngày 1"}]},{"t":"11:30","k":"an","text":"Bữa trưa","parts":[{"who":null,"text":"Bữa trưa"}]},{"t":"12:00","k":"vesinh","text":"Rửa tay, lau miệng","parts":[{"who":null,"text":"Rửa tay, lau miệng"}]},{"t":"12:15","k":"ngoai","text":"Đi dạo, chơi ngoài trời","parts":[{"who":null,"text":"Đi dạo, chơi ngoài trời"}]},{"t":"14:45","k":"ngu","text":"Giấc ngày 2. Nếu bé chỉ ngủ 1 giấc: ngủ trưa 12:30-14:30","parts":[{"who":null,"text":"Giấc ngày 2. Nếu bé chỉ ngủ 1 giấc: ngủ trưa 12:30-14:30"}]},{"t":"16:00","k":"an","text":"Bữa phụ và sữa bằng cốc","parts":[{"who":null,"text":"Bữa phụ và sữa bằng cốc"}]},{"t":"16:30","k":"choi","text":"Chơi, đọc sách, hát","parts":[{"who":null,"text":"Chơi, đọc sách, hát"}]},{"t":"17:45","k":"an","text":"Bữa tối","parts":[{"who":null,"text":"Bữa tối"}]},{"t":"18:30","k":"tam","text":"Tắm tối, mặc đồ ngủ","parts":[{"who":null,"text":"Tắm tối, mặc đồ ngủ"}]},{"t":"18:50","k":"bu","text":"Bú mẹ trước khi ngủ, chải răng","parts":[{"who":null,"text":"Bú mẹ trước khi ngủ, chải răng"}]},{"t":"19:30","k":"ngu","text":"Ngủ đêm","parts":[{"who":null,"text":"Ngủ đêm"}]}],"night":[{"t":"19:30","k":"ngu","text":"Bé ngủ thẳng đến sáng là lý tưởng","parts":[{"who":null,"text":"Bé ngủ thẳng đến sáng là lý tưởng"}]},{"t":"02:00","k":"ngu","text":"Mẹ: nếu bé dậy, đợi vài phút, rồi vào dỗ nhẹ trong cũi, giữ phòng tối / Bố: nhận dỗ đêm thứ Sáu, thứ Bảy","parts":[{"who":"Mẹ","text":"nếu bé dậy, đợi vài phút, rồi vào dỗ nhẹ trong cũi, giữ phòng tối"},{"who":"Bố","text":"nhận dỗ đêm thứ Sáu, thứ Bảy"}]}],"nightTips":["Giữ nếp đi ngủ cố định: tắm, đánh răng, đọc sách, ngủ."],"milk":[{"t":"06:30","k":"bu","text":"Cho bú trực tiếp","parts":[{"who":null,"text":"Cho bú trực tiếp"}]},{"t":"18:50","k":"bu","text":"Cho bú trực tiếp","parts":[{"who":null,"text":"Cho bú trực tiếp"}]}],"milkNotes":["Muốn ngừng hút: giảm dần 1 lần hút mỗi 3-7 ngày, rút ngắn thời gian hút trước khi bỏ hẳn, để tránh tắc tia sữa (B3)."],"notes":["Có thể tiếp tục cho bú đến 2 tuổi hoặc lâu hơn, theo khuyến nghị của WHO.","Từ 1 tuổi bé có thể uống sữa tươi nguyên kem, hỏi bác sĩ trước khi chuyển.","Bỏ dần bình sữa, chuyển sang uống bằng cốc.","Khám định kỳ 12 tháng và tiêm chủng theo lịch."]}],"principles":["Đây là lịch dự kiến. Khi bé thích ứng khác đi (ngủ dài hơn, đòi bú dày hơn, chưa chịu bú bình...), cứ điều chỉnh lịch theo bé.","Giờ trong lịch chỉ là ví dụ. Bé không cần theo đúng từng phút, hãy dựa vào dấu hiệu của bé và dịch cả lịch sớm hoặc muộn cho hợp với nhà mình.","Dấu hiệu bé buồn ngủ: ngáp, dụi mắt, mắt nhìn xa xăm, quay mặt đi, quấy nhẹ. Cho bé ngủ ngay lúc này, đừng đợi bé khóc to vì khi đó bé đã quá mệt, khó vào giấc hơn.","Dấu hiệu bé đói: mút tay, chép miệng, quay đầu tìm vú. Khóc là dấu hiệu đói muộn.","Bú mẹ: cho bú theo nhu cầu, số cữ trong lịch chỉ để tham khảo. Bú bình: lượng sữa ghi là mức trung bình, bé có thể bú ít hoặc nhiều hơn một chút.","Mỗi lần ngủ: đặt bé nằm ngửa, trên nệm phẳng, không gối, không chăn dày, không thú bông (xem A20).","Thay tã trước hoặc sau mỗi cữ bú, và ngay khi bé đi ị.","Bố mẹ cũng cần ngủ đủ: người đi làm nên có ít nhất 6-7 tiếng ngủ liền mỗi đêm để tránh mệt mỏi, chóng mặt, mất tập trung. Kế hoạch ban đêm trong lịch chia ca theo nguyên tắc này."],"night":["Cữ đêm là những lần cho bé bú trong khoảng từ lúc bé ngủ đêm đến sáng hôm sau.","Trẻ sơ sinh chưa thể nhịn qua đêm: dạ dày bé chỉ bằng quả trứng gà, nên cứ 2-4 giờ bé lại đói. Bú đêm cũng giúp giữ sữa mẹ, vì về đêm cơ thể mẹ tiết nhiều hormone tạo sữa hơn.","Không bỏ được cữ đêm trong những tuần đầu, nhưng có thể giảm số lần mẹ phải dậy bằng 3 cách: mẹ đi ngủ sớm ngay sau cữ bú tối, bố cho bé bú bình sữa mẹ lúc 22:00-22:30 trước khi bố đi ngủ để mẹ ngủ liền 5-6 tiếng, và cho bé bú no vào buổi tối.","Bú mơ: khoảng 22:00-23:00, bế bé đang ngủ lên cho bú mà không đánh thức hẳn. Giúp bé ngủ lâu hơn sang nửa sau đêm.","Số cữ đêm giảm dần theo tháng tuổi. Nhiều bé từ 6 tháng không còn cần bú đêm, nhưng nên hỏi bác sĩ trước khi bỏ hẳn.","An toàn: nếu mẹ cho bú trên giường lúc mệt, rất dễ ngủ thiếp đi cùng bé. Cho bú xong, đặt bé về nôi hoặc cũi riêng. Bố ngồi cạnh để đỡ bé khi mẹ buồn ngủ."],"bottle":["Hâm sữa: ngâm bình vào cốc nước ấm (khoảng 40°C) 3-5 phút, lắc nhẹ cho đều. Nhỏ vài giọt lên cổ tay, thấy âm ấm là được.","Không hâm bằng lò vi sóng (nóng không đều, dễ bỏng miệng bé), không đun sôi (mất chất).","Sữa đã hâm: dùng trong 1-2 giờ, không hâm lại lần thứ hai.","Bú bình theo nhịp: bế bé ngồi hơi thẳng, giữ bình nằm ngang, cho bé nghỉ mỗi 20-30 giây bằng cách hạ bình. Bé bú chậm như bú mẹ, đỡ bị quen bình mà chê vú.","Dùng núm vú chảy chậm (size nhỏ nhất) cho đến khi bé lớn hơn.","Người khác (bố, bà) nên là người cho bú bình. Bé thường không chịu bú bình khi ngửi thấy mùi mẹ ở gần."],"storage":["Sữa mới hút để ở nhiệt độ phòng (dưới 25°C): dùng trong 4 giờ.","Ngăn mát tủ lạnh (khoảng 4°C): dùng trong 4 ngày. Để ở sâu bên trong, không để ở cánh cửa tủ.","Ngăn đá: tốt nhất dùng trong 6 tháng, tối đa 12 tháng.","Rã đông bằng cách để xuống ngăn mát qua đêm, hoặc ngâm bình vào nước ấm.","Sữa đã rã đông: dùng trong 24 giờ nếu để ngăn mát, không cấp đông lại.","Sữa bé bú dở: dùng trong 2 giờ, sau đó bỏ đi.","Ghi ngày giờ hút lên từng túi, dùng túi cũ trước. Mỗi túi chỉ trữ 60-120 ml để không phải bỏ phí."],"formula":["Sữa mẹ là đủ cho bé trong 6 tháng đầu. Nếu bé tăng cân tốt, đủ tã ướt, thì không cần thêm sữa công thức.","Nên dùng sữa công thức (theo hướng dẫn của bác sĩ) khi: bé tăng cân chậm hoặc sụt cân dù đã chỉnh cách cho bú, bé có dấu hiệu mất nước (K5), hoặc bác sĩ chỉ định vì vàng da, hạ đường huyết.","Khi mẹ đã cố gắng tăng sữa 1-2 tuần (bú và hút thường xuyên, xem B5) mà vẫn không đủ: bổ sung phần thiếu bằng sữa công thức, vẫn tiếp tục cho bú mẹ. Mỗi giọt sữa mẹ vẫn có ích.","Khi mẹ phải dùng thuốc không an toàn cho con bú, mẹ ốm nặng, hoặc phải xa con lâu mà không đủ sữa trữ.","Khi mẹ đi làm lại và sữa trữ không đủ cho các cữ ban ngày: thay một vài cữ ban ngày bằng sữa công thức, các cữ sáng, tối, đêm vẫn bú mẹ.","Cách bắt đầu: hỏi bác sĩ nhi để chọn loại sữa công thức cho trẻ 0-12 tháng. Thêm từ 1 bình mỗi ngày, theo dõi bé đi ngoài, da, bụng vài ngày rồi mới tăng dần.","Pha đúng tỉ lệ ghi trên hộp, không pha đặc hơn hay loãng hơn. Nước pha phải đun sôi rồi để nguội còn khoảng 70°C, pha xong làm nguội nhanh trước khi cho bú. Sữa đã pha dùng trong 2 giờ.","Không dùng sữa bò tươi, sữa hộp người lớn, sữa đặc cho bé dưới 12 tháng.","Dùng sữa công thức không phải thất bại của mẹ. Bé được ăn no và mẹ đủ sức khỏe mới là điều quan trọng."],"lrhythm":["L là khoảng cách giữa hai lần làm trống vú, tức là bé bú trực tiếp hoặc mẹ hút. L2 là khoảng 2 tiếng một lần, L3 khoảng 3 tiếng, L4 khoảng 4 tiếng (khoảng 6 lần mỗi ngày), L5 khoảng 5 tiếng.","Mỗi lần bé bú trực tiếp cũng tính là một lần. Nhà mình cho bú mẹ là chính nên không cần hút đủ số lần, chỉ cần khoảng cách giữa hai lần bú hoặc hút không dài hơn mức L của giai đoạn đó.","Lộ trình thường gặp: L2-L3 trong những tuần đầu để gọi sữa về, giữ L3 đến khi sữa ổn định (thường 2-3 tháng), rồi giãn dần sang L4, L5 khi bé lớn và ăn dặm nhiều hơn.","Cách giãn: mỗi 3-4 ngày lùi thêm 15-30 phút. Không nhảy một lần từ 3 tiếng lên 4 tiếng. Khi sữa đã ổn định, khoảng ban đêm có thể dài hơn ban ngày.","Theo dõi: vài ngày một lần ghi tổng lượng sữa hút được trong 24 giờ, và cân nặng của bé mỗi lần đi khám.","Quay lại lịch dày hơn khi: tổng lượng sữa 24 giờ giảm rõ trong vài ngày liền, bé tăng cân chậm, ít tã ướt, hoặc vú hay căng tức, tắc tia (B3).","Mỗi mẹ một khác: có mẹ giãn sang L4 sớm vẫn đủ sữa, có mẹ cần giữ L3 lâu hơn. Không có con số đúng cho mọi người.","Đây là cách làm phổ biến trong cộng đồng các mẹ, không phải quy định y khoa. Khi sữa giảm, hỏi bác sĩ hoặc chuyên viên tư vấn sữa mẹ."]}}</script>
<script>
window.APP_VERSION = "a38b11858c";
(function () {
  "use strict";

  /* ============================================================
     Dữ liệu
     ============================================================ */
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SIT = {}, SKILL = {}, CAT = {};
  DATA.situations.forEach(function (s) { SIT[s.id] = s; });
  DATA.skills.forEach(function (k) { SKILL[k.id] = k; });
  DATA.categories.forEach(function (c) { CAT[c.id] = c; });

  // Từ điển: mỗi từ (kể cả tên gọi khác) trỏ về một mục giải thích
  var GLOSS = DATA.glossary || [];
  var TERM_IDX = {};
  var aliases = [];
  GLOSS.forEach(function (g, i) {
    g.aliases.forEach(function (a) { TERM_IDX[a.toLowerCase()] = i; aliases.push(a); });
  });
  aliases.sort(function (a, b) { return b.length - a.length; });
  var TERM_RE = null;
  try {
    TERM_RE = new RegExp("(?<![\\p{L}\\d])(" + aliases.map(function (a) {
      return a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("|") + ")(?![\\p{L}\\d])", "giu");
  } catch (e) { TERM_RE = null; }   // trình duyệt quá cũ: bỏ qua gạch chân
  var termSeen = {};      // mỗi trang chỉ gạch chân lần xuất hiện đầu tiên của một từ
  var termSkip = -1;      // không gạch chân từ trùng với chính trang đang xem

  var SEV_LABEL = { green: "Thường gặp", yellow: "Cần lưu ý", red: "Nguy hiểm" };
  var CHECK_TTL = 12 * 3600 * 1000;   // checklist tự xoá sau 12 giờ

  /* ============================================================
     Lưu trữ an toàn (trình duyệt riêng tư có thể chặn)
     ============================================================ */
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ============================================================
     Tiện ích
     ============================================================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(s) { return String(s).replace(/\*\*/g, ""); }

  function refChip(id) {
    if (SKILL[id]) return '<button class="ref" data-skill="' + id + '">' + esc(SKILL[id].short) + "</button>";
    if (SIT[id]) return '<a class="ref" href="#/t/' + id + '">' + esc(SIT[id].title) + "</a>";
    return id;
  }
  // **đậm**, "(xem K1)", "(K5)", "theo K2" thành chip bấm được
  function fmt(s) {
    var h = esc(s);
    if (TERM_RE) {
      h = h.replace(TERM_RE, function (m) {
        var i = TERM_IDX[m.toLowerCase()];
        if (i == null || i === termSkip || termSeen[i]) return m;
        termSeen[i] = 1;
        return '<button class="term" data-term="' + i + '">' + m + "</button>";
      });
    }
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\s?\((?:xem )?([AKB]\d{1,2})\)/g, function (_, id) { return " " + refChip(id); });
    h = h.replace(/\b(theo|xem) ([AKB]\d{1,2})\b/g, function (_, w, id) { return w + " " + refChip(id); });
    return h;
  }

  // Bỏ dấu tiếng Việt, giữ nguyên độ dài từng ký tự để còn tô sáng được
  function normChar(c) {
    if (c === "đ" || c === "Đ") return "d";
    var n = c.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return (n.length === 1 ? n : c).toLowerCase();
  }
  function norm(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) out += normChar(s[i]);
    return out;
  }

  var ICON = {
    chev: '<svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    tw: '<svg class="tw" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.6 3.5l2.6-.3 1.6 4.3-2 1.5a12 12 0 0 0 6.2 6.2l1.5-2 4.3 1.6-.3 2.6a2.5 2.5 0 0 1-2.6 2.1C10.4 21 3 13.6 4.5 6.1a2.5 2.5 0 0 1 2.1-2.6z" fill="currentColor"/></svg>',
    alert: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5l9 16H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>',
    search: '<svg class="s-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    prevent: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z" fill="currentColor"/></svg>',
    avoid: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="2.6"/></svg>',
    doctor: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="currentColor"/></svg>',
    info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.5" fill="currentColor"/></svg>'
  };

  function dots(sev) {
    return '<span class="dots" aria-hidden="true">' +
      sev.map(function (c) { return '<span class="dot ' + c + '"></span>'; }).join("") + "</span>";
  }
  function sevNote(sev) {
    var g = sev.indexOf("green") > -1, y = sev.indexOf("yellow") > -1, r = sev.indexOf("red") > -1;
    if (r && !g && !y) return "Cần đi khám ngay.";
    if (r && g) return "Thường không nguy hiểm, nhưng có trường hợp phải đi cấp cứu.";
    if (r) return "Có thể nguy hiểm. Đọc kỹ các dấu hiệu phải đi khám.";
    if (y && g) return "Thường xử lý được tại nhà, đôi khi cần hỏi bác sĩ.";
    if (y) return "Nên hỏi bác sĩ nếu không đỡ sau 24-48 giờ.";
    return "Thường gặp, chăm sóc được tại nhà.";
  }
  function sevA11y(sev) { return sev.map(function (c) { return SEV_LABEL[c]; }).join(" đến "); }

  /* ============================================================
     Checklist: đánh dấu từng bước đã làm
     ============================================================ */
  function checkKey(id) { return "xltn-check-" + id; }
  function loadCheck(id) {
    var c = store.get(checkKey(id), null);
    if (!c || Date.now() - c.ts > CHECK_TTL) return { ts: 0, done: {} };
    return c;
  }
  function saveCheck(id, c) {
    if (Object.keys(c.done).length) store.set(checkKey(id), c);
    else store.del(checkKey(id));
  }
  function timeStr(ts) {
    var d = new Date(ts);
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function renderSteps(ownerId, sec, si, check) {
    var total = sec.items.length;
    var n = 0;
    var lis = sec.items.map(function (it, i) {
      var key = si + "-" + i;
      var done = !!check.done[key];
      if (done) n++;
      var sub = "";
      if (it.children.length) {
        var ol = /^\d/.test(it.children[0]) ? "" : "";
        sub = '<ul class="sub' + ol + '">' + it.children.map(function (c) {
          return "<li>" + fmt(c) + "</li>";
        }).join("") + "</ul>";
      }
      return '<li class="step' + (done ? " done" : "") + '" data-owner="' + ownerId + '" data-key="' + key +
        '" role="checkbox" aria-checked="' + done + '" tabindex="0">' +
        '<span class="step-n"><span>' + (i + 1) + "</span>" + ICON.check + "</span>" +
        '<div class="step-body"><div class="step-text">' + fmt(it.text) + "</div>" + sub + "</div></li>";
    }).join("");
    var label = sec.label || "Các bước";
    return '<section class="block k-steps" data-sec="' + si + '">' +
      '<div class="block-head"><h2>' + esc(label) + "</h2>" +
      '<span class="progress' + (n === total ? " done" : "") + '" data-progress="' + si + '">' + n + "/" + total + "</span></div>" +
      '<ol class="steps">' + lis + "</ol></section>";
  }

  function renderOther(sec, opts) {
    var kind = sec.kind;
    var open = kind !== "prevent" || opts.openAll;
    var label = sec.label || "Ghi chú";
    var body = "";
    if (sec.text) body += '<p class="ptext">' + fmt(sec.text) + "</p>";
    if (sec.items.length) {
      body += '<ul class="blist">' + sec.items.map(function (it) {
        var sub = it.children.length ? '<ul class="sub">' + it.children.map(function (c) {
          return "<li>" + fmt(c) + "</li>"; }).join("") + "</ul>" : "";
        return "<li>" + fmt(it.text) + sub + "</li>";
      }).join("") + "</ul>";
    }
    if (kind === "doctor" && opts.call) {
      body += '<a class="btn danger big call" href="tel:115">' + ICON.phone + "Gọi cấp cứu 115</a>";
    }
    return '<details class="block k-' + kind + '"' + (open ? " open" : "") +
      (kind === "doctor" ? ' id="kham"' : "") + "><summary>" +
      '<span class="k-ico">' + (ICON[kind] || ICON.info) + "</span><h2>" + esc(label) + "</h2>" + ICON.tw +
      "</summary>" + body + "</details>";
  }

  function renderItemBody(item, opts) {
    opts = opts || {};
    var check = loadCheck(item.id);
    var hasRed = (item.severity || []).indexOf("red") > -1;
    var html = "";
    var stepSecs = 0;
    item.sections.forEach(function (sec, si) {
      if (sec.kind === "about") return;   // phần "Đây là gì" hiện riêng ở đầu trang
      if (sec.kind === "steps") {
        stepSecs++;
        html += renderSteps(item.id, sec, si, check);
      } else {
        html += renderOther(sec, { call: hasRed || /cấp cứu/i.test(sec.label || ""), openAll: opts.openAll });
      }
    });
    (item.notes || []).forEach(function (n) {
      html += '<div class="note">' + ICON.info.replace("<svg ", '<svg width="20" height="20" style="flex:none;margin-top:2px" ') +
        "<div>" + fmt(n) + "</div></div>";
    });
    var bar = "";
    if (stepSecs) {
      bar = '<div class="since" data-since="' + item.id + '">' + sinceText(check) + "</div>";
    }
    return bar + html;
  }
  function sinceText(check) {
    if (!check.ts || !Object.keys(check.done).length) {
      return "Chạm vào từng bước để đánh dấu đã làm. Chạm vào <span class=\"term-demo\">chữ gạch chân</span> để xem nghĩa.";
    }
    return 'Đánh dấu từ lúc ' + timeStr(check.ts) + ' · <button class="reset" data-reset>Làm lại từ đầu</button>';
  }

  function toggleStep(el) {
    var owner = el.getAttribute("data-owner"), key = el.getAttribute("data-key");
    var c = loadCheck(owner);
    var on = !c.done[key];
    if (on) { c.done[key] = 1; if (!c.ts) c.ts = Date.now(); }
    else delete c.done[key];
    if (!Object.keys(c.done).length) c.ts = 0;
    saveCheck(owner, c);
    el.classList.toggle("done", on);
    el.setAttribute("aria-checked", on);
    if (on && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    refreshProgress(el.closest(".block"), owner);
  }
  function refreshProgress(block, owner) {
    if (!block) return;
    var all = block.querySelectorAll(".step").length;
    var n = block.querySelectorAll(".step.done").length;
    var p = block.querySelector(".progress");
    if (p) { p.textContent = n + "/" + all; p.classList.toggle("done", n === all); }
    var root = block.parentNode;
    var since = root.querySelector('[data-since="' + owner + '"]');

  var INDEX = [];
  function bodyText(item) {
    var parts = [];
    item.sections.forEach(function (s) {
      if (s.label) parts.push(s.label);
      if (s.text) parts.push(s.text);
      s.items.forEach(function (it) { parts.push(it.text); parts = parts.concat(it.children); });
    });
    return plain(parts.join(" · ")).replace(/\(xem [AKB]\d+\)|\([AKB]\d+\)/g, "");
  }
  function buildIndex() {
    DATA.situations.concat(DATA.skills).forEach(function (it) {
      var body = bodyText(it);
      INDEX.push({ item: it, t: norm(it.title), k: norm(it.keywords || ""), b: norm(body), body: body });
    });
    GLOSS.forEach(function (g, i) {
      var item = { id: "G" + i, title: g.term, gloss: i };
      INDEX.push({ item: item, t: norm(g.term), k: norm(g.aliases.join(", ")), b: norm(g.text), body: g.text });
    });
  }
  // vị trí đầu tiên mà t khớp ở đầu một từ ("ho" khớp "ho khan", không khớp "hơi")
  // từ ngắn 1-2 chữ phải khớp trọn từ, nếu không "ho" sẽ khớp cả "hơi"
  function wordAt(text, t) {
    var whole = t.length <= 2;
    var i = text.indexOf(t);
    while (i > -1) {
      var startOk = i === 0 || !/[a-z0-9]/.test(text[i - 1]);
      var endOk = !whole || !/[a-z0-9]/.test(text[i + t.length] || "");
      if (startOk && endOk) return i;
      i = text.indexOf(t, i + 1);
    }
    return -1;
  }
  function search(q) {
    var nq = norm(q.trim()).replace(/\s+/g, " ");
    if (!nq) return [];
    var toks = nq.split(" ").filter(Boolean);
    var res = [];
    INDEX.forEach(function (d) {
      var score = 0, ok = true;
      toks.forEach(function (t) {
        var s = 0;
        if (wordAt(d.t, t) > -1) s += 12;
        if (wordAt(d.k, t) > -1) s += 7;
        if (wordAt(d.b, t) > -1) s += 1;
        if (!s) ok = false;
        score += s;
      });
      if (!ok) return;
      if (toks.length > 1) {
        if (wordAt(d.t, nq) > -1) score += 20;
        if (wordAt(d.k, nq) > -1) score += 12;
        if (wordAt(d.b, nq) > -1) score += 3;
      }
      if (d.item.id[0] === "K") score -= 2;
      if (d.item.id[0] === "G") score -= 1;
      res.push({ d: d, score: score, toks: toks, nq: nq });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    return res.slice(0, 30);
  }
  function snippet(r) {
    var d = r.d;
    var needle = wordAt(d.b, r.nq) > -1 ? r.nq : null;
    if (!needle) {
      for (var i = 0; i < r.toks.length; i++) if (wordAt(d.b, r.toks[i]) > -1) { needle = r.toks[i]; break; }
    }
    var at = needle ? wordAt(d.b, needle) : -1;
    if (at < 0) return d.item.severity && d.item.severity.length ? esc(sevNote(d.item.severity)) : "Kỹ năng cơ bản";
    var start = Math.max(0, at - 36);
    var end = Math.min(d.body.length, at + needle.length + 70);
    // cắt ở ranh giới từ cho gọn
    if (start > 0) { var sp = d.body.indexOf(" ", start); if (sp > -1 && sp < at) start = sp + 1; }
    return (start > 0 ? "…" : "") + esc(d.body.slice(start, at)) + "<mark>" + esc(d.body.slice(at, at + needle.length)) +
      "</mark>" + esc(d.body.slice(at + needle.length, end)) + (end < d.body.length ? "…" : "");
  }

  function babyAge() {
    var dob = store.get("xltn-dob", "");
    if (!dob) return null;
    var b = new Date(dob + "T00:00:00"), n = new Date();
    if (isNaN(b)) return null;
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    if (b > today) return { future: true, daysLeft: Math.round((b - today) / 86400000), dob: dob };
    var months = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth()) - (n.getDate() < b.getDate() ? 1 : 0);
    var days = Math.round((today - b) / 86400000);
    return { months: months, days: days, dob: dob };
  }

    if (a.months < 1) return "Bé được " + Math.floor(a.days / 7) + " tuần " + (a.days % 7) + " ngày";
    if (a.months > 12) return "Bé đã hơn 1 tuổi (" + a.months + " tháng)";
    return "Bé được " + a.months + " tháng";
  }

        '<p class="dob-hint">Chọn ngày trong tương lai nếu bé chưa sinh, app sẽ hiểu là ngày dự sinh.</p>' +
        '<div class="dob-actions"><button class="btn primary" data-dob="save">Lưu</button>' +
        '<button class="btn" data-dob="cancel">Huỷ</button>' +
        (a ? '<button class="btn ghost dob-del" data-dob="del">Xoá</button>' : "") + "</div>";
    } else {
      html += '<button class="btn dob-edit" data-dob="edit">' + (a ? "Sửa" : "Nhập ngày sinh") + "</button>";
    }
    box.innerHTML = html + "</div>";
  }
  function dobAction(act) {
    if (act === "edit") { renderDob(true); var i = $("#dobIn"); if (i) i.focus(); return; }
    if (act === "cancel") { renderDob(false); return; }
    if (act === "del") { store.del("xltn-dob"); renderDob(false); drawPlan(store.get("xltn-plan-stage", "0a")); toast("Đã xoá ngày sinh"); return; }
    if (act === "save") {
      var v = ($("#dobIn") || {}).value || "";
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Hãy chọn một ngày trước khi lưu"); return; }
      store.set("xltn-dob", v);
      renderDob(false);
      var na = babyAge();
      drawPlan(ageStage(na) || "0a");
      toast("Đã lưu · " + ageText(na));
    }
  }

  function pickStage(param) {
    if (param && STAGE[param]) return param;
    var k = ageStage(babyAge());
    if (k) return k;
    var saved = store.get("xltn-plan-stage", "0a");
    return STAGE[saved] ? saved : "0a";
  }

  // thứ tự trong ngày, mục qua nửa đêm tính sang ngày hôm sau
  function seqMinutes(items) {
    var off = 0, prev = -1;
    return items.map(function (s) {
      var p = s.t.split(":"), m = (+p[0]) * 60 + (+p[1]);
      if (m < prev) off += 1440;
      prev = m;
      return m + off;
    });
  }
  function nowIndex(items) {
    if (!items.length) return -1;
    var seq = seqMinutes(items);
    var d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    if (now < seq[0]) now += 1440;
    var idx = -1;
    for (var i = 0; i < seq.length; i++) if (seq[i] <= now) idx = i;
    return idx;
  }

  // chỉ đánh dấu "Bây giờ" trong kế hoạch ban đêm khi đang là ban đêm thật
  function isNightNow() { var h = new Date().getHours(); return h >= 20 || h < 6; }

  function slotText(s) {
    if (!s.parts || (s.parts.length === 1 && !s.parts[0].who)) return '<span class="slot-text">' + fmt(s.text) + "</span>";
    return s.parts.map(function (p) {
      return '<span class="slot-text">' + (p.who ? '<span class="who" style="--c:var(' + (WHO[p.who] || "--blue") + ')">' + esc(p.who) + "</span>" : "") +
        fmt(p.text) + "</span>";
    }).join("");
  }
  function timeline(items, opts) {
    opts = opts || {};
    var cur = opts.noNow ? -1 : nowIndex(items);
    var seq = seqMinutes(items);
    var nightShown = !!opts.noNightSep;
    return '<ol class="tl">' + items.map(function (s, i) {
      var k = KIND[s.k] || KIND.choi;
      var night = seq[i] >= 1440 || (+s.t.slice(0, 2) >= 22) || s.k === "dem";
      var sep = "";
      if (night && !nightShown) { nightShown = true; sep = '<li class="slot-sep">🌙 Ban đêm</li>'; }
      return sep + '<li class="slot' + (night ? " night" : "") + (i === cur ? " now" : "") + '" style="--c:var(' + k.c + ')">' +
        '<span class="slot-time">' + s.t + "</span>" +
        '<span class="slot-ico" aria-hidden="true">' + k.i + "</span>" +
        '<span class="slot-body"><span class="slot-kind">' + k.l + (i === cur ? '<span class="now-tag">Bây giờ</span>' : "") + "</span>" +
        slotText(s) + "</span></li>";
    }).join("") + "</ol>";
  }

  function listCard(title, icon, color, items, open, collapsible) {
    if (!items || !items.length) return "";
    var body = '<ul class="plan-list" style="--c:var(' + color + ')">' + items.map(function (x) { return "<li>" + fmt(x) + "</li>"; }).join("") + "</ul>";
    var ico = '<span class="k-ico" style="background:linear-gradient(160deg,var(' + color + '),color-mix(in srgb,var(' + color + ') 60%,#000))">' + icon + "</span>";
    if (!collapsible) return '<section class="plan-card"><h3>' + ico + esc(title) + "</h3>" + body + "</section>";
    return '<details class="plan-card"' + (open ? " open" : "") + "><summary>" + ico + "<span>" + esc(title) + "</span>" + ICON.tw + "</summary>" + body + "</details>";
  }

  var planView = store.get("xltn-plan-view", "be");
  if (["be", "dem", "sua"].indexOf(planView) < 0) planView = "be";
  function pagePlan(param) {
    setTitle("Lịch trình");
    view.innerHTML = '<h1 id="pageH1">Lịch trình</h1>' +
      '<p class="lede">Một ngày mẫu của bé theo từng giai đoạn: ban ngày, kế hoạch ban đêm cho bố mẹ, và lịch bú, hút sữa.</p>' +
      '<div id="dobBox"></div><div class="months" id="months" role="tablist" aria-label="Chọn giai đoạn"></div><div id="planBody"></div>';
    renderDob(false);
    drawPlan(pickStage(param), true);
  }

  function drawPlan(key, first) {
    var st = STAGE[key];
    if (!st) return;
    store.set("xltn-plan-stage", key);
    var a = babyAge();
    var ageKey = ageStage(a);

    var box = $("#months");
    box.innerHTML = STAGES.map(function (s) {
      return '<button class="mchip' + (s.key === key ? " on" : "") + (s.key === ageKey ? " age" : "") + '" role="tab" aria-selected="' +
        (s.key === key) + '" data-stage="' + s.key + '"><b>' + esc(s.big) + "</b><small>" + esc(s.small) + "</small></button>";
    }).join("");
    var on = box.querySelector(".on");
    if (on) {
      // tính theo vị trí thật trong thanh cuộn, không theo offsetLeft (lệch khi nội dung căn giữa màn hình rộng)
      var x = box.scrollLeft + on.getBoundingClientRect().left - box.getBoundingClientRect().left - box.clientWidth / 2 + on.offsetWidth / 2;
      x = Math.max(0, x);
      if (first) box.scrollLeft = x; else box.scrollTo({ left: x, behavior: "smooth" });
    }

    termSeen = {};
    var prev = STAGES[st.i - 1], next = STAGES[st.i + 1];
    var arrow = function (s, dir) {
      return '<button class="glass-btn"' + (s ? ' data-stage="' + s.key + '"' : " disabled") + ' aria-label="' + (dir < 0 ? "Giai đoạn trước" : "Giai đoạn sau") + '">' +
        '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="' + (dir < 0 ? "M14.5 5l-7 7 7 7" : "M9.5 5l7 7-7 7") +
        '" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    };
    var head = '<div class="plan-head"><div><h2>' + esc(stageName(st)) + "</h2><p>" + esc(st.sub) + "</p></div>" +
      '<div class="plan-nav">' + arrow(prev, -1) + arrow(next, 1) + "</div></div>";
    var stats = '<div class="stats">' + st.summary.map(function (s) {
      return '<div class="stat"><div class="stat-ico" aria-hidden="true">' + statIcon(s.label) + '</div><div class="stat-l">' +
        esc(s.label) + '</div><div class="stat-v">' + esc(s.value) + "</div></div>";
    }).join("") + "</div>";
    var seg = '<div class="seg" role="group" aria-label="Chọn lịch">' +
      '<button data-pv="be" aria-pressed="' + (planView === "be") + '">☀️ Ban ngày</button>' +
      '<button data-pv="dem" aria-pressed="' + (planView === "dem") + '">🌙 Ban đêm</button>' +
      '<button data-pv="sua" aria-pressed="' + (planView === "sua") + '">🍼 Bú & hút</button></div>';

    var body;
    if (planView === "dem") {
      body = listCard("Cữ đêm là gì?", "🌙", "--indigo", SCHED.night, false, true) +
        '<div class="eyebrow">Kế hoạch ban đêm · ai làm gì</div>' + timeline(st.night, { noNightSep: true, noNow: !isNightNow() }) + '<div class="plan-gap"></div>' +
        listCard("Mẹo để mẹ đỡ phải dậy", "💡", "--yellow", st.nightTips, false, true);
    } else if (planView === "sua") {
      body = (st.milk.length ? '<div class="eyebrow">Giờ bú trực tiếp và hút sữa</div>' + timeline(st.milk, { noNightSep: true }) + '<div class="plan-gap"></div>' : "") +
        listCard(st.milk.length ? "Ghi chú và phương án khác" : "Bú và hút sữa giai đoạn này", "🤱", "--pink", st.milkNotes, false, true) +
        listCard("Lịch hút L2, L3, L4 là gì?", "🔁", "--indigo", SCHED.lrhythm, false, true) +
        listCard("Cho bé bú bình sữa mẹ", "🍼", "--blue", SCHED.bottle, false, true) +
        listCard("Bảo quản sữa mẹ", "🧊", "--teal", SCHED.storage, false, true) +
        listCard("Khi nào dùng sữa công thức?", "🥛", "--orange", SCHED.formula, false, true);
    } else {
      body = timeline(st.baby) + '<div class="plan-gap"></div>' +
        listCard("Lưu ý giai đoạn này", "💡", "--yellow", st.notes, false, true) +
        listCard("Nguyên tắc chung", "🧭", "--indigo", SCHED.principles, false, true);
    }
    $("#planBody").innerHTML = head + stats + seg + body +
      '<p class="disclaimer">Giờ trong lịch chỉ là ví dụ để tham khảo, không phải quy định. Mỗi bé một khác: hãy theo dấu hiệu đói, buồn ngủ của bé và lời khuyên của bác sĩ.</p>';

    var h = "#/lich-trinh/" + key;
    if (location.hash !== h) { history.replaceState(null, "", h); curHash = h; }
  }

  // ô "Bây giờ / Tiếp theo" ở trang chủ, khi đã có ngày sinh hoặc đã xem lịch
  function nowWidget() {
    var key = ageStage(babyAge()) || store.get("xltn-plan-stage", null);
    var st = key && STAGE[key];
    if (!st) return "";
    var items = st.baby, i = nowIndex(items);
    if (i < 0) i = items.length - 1;
    var cur = items[i], next = items[(i + 1) % items.length];
    var k1 = KIND[cur.k] || KIND.choi, k2 = KIND[next.k] || KIND.choi;
    var clean = function (s) { return esc(plain(s).replace(/\s*\((?:xem )?[AKB]\d+\)/g, "")); };
    return '<a class="list" href="#/lich-trinh/' + key + '" style="margin:6px 0 4px;text-decoration:none">' +
      '<span class="row" style="--c:var(' + k1.c + ')"><span class="slot-ico" aria-hidden="true">' + k1.i + "</span>" +
      '<span class="row-main"><span class="row-sub" style="-webkit-line-clamp:1">Bây giờ · ' + esc(stageName(st)) + "</span>" +
      '<span class="row-title">' + clean(cur.text) + "</span></span></span>" +
      '<span class="row" style="--c:var(' + k2.c + ')"><span class="slot-ico" aria-hidden="true">' + k2.i + "</span>" +
      '<span class="row-main"><span class="row-sub" style="-webkit-line-clamp:1">Tiếp theo · ' + next.t + "</span>" +
      '<span class="row-title">' + clean(next.text) + "</span></span>" + ICON.chev + "</span></a>";
  }

  /* ============================================================
     Công cụ: đếm nhịp thở, hẹn giờ đo lại nhiệt độ
     ============================================================ */
  var breath = { age: store.get("xltn-breath-age", "u2"), state: "idle", count: 0, start: 0, raf: 0, timer: 0 };
  var LIMIT = { u2: 60, o2: 50 };

  function pageTools() {
    setTitle("Công cụ");
    view.innerHTML =
      '<h1 id="pageH1">Công cụ</h1><p class="lede">Dùng khi đang theo dõi bé.</p>' +
      '<section class="tool" id="breathTool"><h2>Đếm nhịp thở</h2>' +
      "<p>Đếm khi bé nằm yên hoặc đang ngủ. Mỗi lần bụng bé phồng lên, chạm vào ô bên dưới một lần.</p>" +
      '<div class="seg" role="group" aria-label="Tuổi của bé">' +
      '<button data-age="u2">Dưới 2 tháng</button><button data-age="o2">2-12 tháng</button></div>' +
      '<button class="tap idle" id="tap"></button>' +
      '<div class="timer-bar"><i id="bar"></i></div><div class="timer-meta"><span id="tLeft"></span><span id="tHint"></span></div>' +
      '<div id="verdict"></div></section>' +
      '<section class="tool" id="tempTool"><h2>Hẹn giờ đo lại nhiệt độ</h2>' +
      "<p>Sau khi hạ sốt hoặc ủ ấm, đo lại theo giờ hẹn. Chuông chỉ kêu khi app đang mở, nên để điện thoại gần bên.</p>" +
      '<div id="tempBox"></div><p style="margin:12px 0 0">' + refChip("K3") + "</p></section>";
    view.querySelectorAll("[data-age]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (breath.state === "run") return;
        breath.age = b.getAttribute("data-age");
        store.set("xltn-breath-age", breath.age);
        drawBreath();
      });
    });
    $("#tap").addEventListener("pointerdown", onTap);
    $("#tap").addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); onTap(e); } });
    drawBreath();
    drawTemp();
  }

  function onTap(e) {
    if (e && e.type === "pointerdown") e.preventDefault();
    if (breath.state === "idle" || breath.state === "done") {
      breath.state = "run"; breath.count = 0; breath.start = Date.now();
      wakeLock(true);
      tickBreath();
    } else if (breath.state === "run") {
      breath.count++;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (x) {} }
    }
    drawBreath();
  }
  function tickBreath() {
    cancelAnimationFrame(breath.raf);
    var loop = function () {
      if (breath.state !== "run") return;
      var el = Date.now() - breath.start;
      if (el >= 60000) {
        breath.state = "done"; wakeLock(false); beep(1); drawBreath(); return;
      }
      var bar = $("#bar"), left = $("#tLeft");
      if (!bar) { breath.state = "idle"; wakeLock(false); return; }
      bar.style.width = (el / 600) + "%";
      left.textContent = "Còn " + Math.ceil((60000 - el) / 1000) + " giây";
      breath.raf = requestAnimationFrame(loop);
    };
    loop();
  }
  function drawBreath() {
    var tap = $("#tap");
    if (!tap) return;
    view.querySelectorAll("[data-age]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-age") === breath.age);
    });
    var lim = LIMIT[breath.age];
    $("#tHint").textContent = "Bình thường dưới " + lim + " lần/phút";
    var v = $("#verdict");
    if (breath.state === "run") {
      tap.className = "tap";
      tap.innerHTML = '<span class="big">' + breath.count + '</span><span class="small">Chạm mỗi lần bé hít vào</span>';
      v.innerHTML = "";
    } else if (breath.state === "done") {
      tap.className = "tap idle";
      tap.innerHTML = '<span class="big">' + breath.count + '</span><span class="small">lần/phút · Chạm để đếm lại</span>';
      $("#bar").style.width = "100%";
      $("#tLeft").textContent = "Đã đủ 60 giây";
      var n = breath.count;
      if (n >= lim) {
        v.innerHTML = '<div class="verdict bad"><strong>Thở nhanh: ' + n + " lần/phút</strong>" +
          "Đếm lại một lần nữa khi bé nằm thật yên. Nếu vẫn từ " + lim + " lần trở lên, hoặc bé rút lõm ngực, phập phồng cánh mũi, tím môi: đi khám ngay.</div>" +
          '<a class="btn danger big" style="margin-top:10px" href="tel:115">' + ICON.phone + "Gọi 115</a>";
      } else if (n < 20) {
        v.innerHTML = '<div class="verdict bad"><strong>Chỉ đếm được ' + n + " lần</strong>" +
          "Có thể đã đếm sót, hãy đếm lại. Nếu bé có lúc ngừng thở trên 20 giây, tím tái hoặc khó đánh thức: gọi 115 ngay.</div>";
      } else {
        v.innerHTML = '<div class="verdict ok"><strong>' + n + " lần/phút: trong giới hạn bình thường</strong>" +
          "Vẫn theo dõi thêm các dấu hiệu rút lõm ngực, phập phồng cánh mũi, tím môi.</div>";
      }
    } else {
      tap.className = "tap idle";
      tap.innerHTML = '<span class="big" style="font-size:40px">Bắt đầu</span><span class="small">Chạm để bắt đầu đếm 60 giây</span>';
      $("#bar").style.width = "0";
      $("#tLeft").textContent = "60 giây";
      v.innerHTML = "";
    }
  }

  // ---- hẹn giờ nhiệt độ ----
  var tempTick = 0;
  function tempEnd() { return store.get("xltn-temp-end", 0); }
  function drawTemp() {
    var box = $("#tempBox");
    if (!box) return;
    var end = tempEnd();
    if (!end) {
      box.innerHTML = '<div class="row-btns"><button class="btn primary" data-temp="30">Sau 30 phút</button>' +
        '<button class="btn primary" data-temp="60">Sau 60 phút</button></div>';
    } else {
      var left = end - Date.now();
      box.innerHTML = '<div class="countdown' + (left <= 0 ? " ring" : "") + '" id="tempLeft">' + fmtLeft(left) + "</div>" +
        '<div class="row-btns"><button class="btn" data-temp="stop">' + (left <= 0 ? "Tắt chuông" : "Huỷ hẹn giờ") + "</button></div>" +
        '<p style="margin:10px 0 0;font-size:14px">Hẹn lúc ' + timeStr(end) + ".</p>";
    }
    box.querySelectorAll("[data-temp]").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-temp");
        if (v === "stop") { store.del("xltn-temp-end"); stopAlarm(); }
        else { unlockAudio(); store.set("xltn-temp-end", Date.now() + (+v) * 60000); toast("Đã hẹn giờ " + v + " phút"); }
        drawTemp(); checkTemp();
      });
    });
  }
  function fmtLeft(ms) {
    if (ms <= 0) return "Đến giờ!";
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
    return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  var alarming = false, alarmLoop = 0;
  function checkTemp() {
    clearInterval(tempTick);
    var end = tempEnd();
    if (!end) { stopAlarm(); return; }
    var step = function () {
      var left = tempEnd() - Date.now();
      var el = $("#tempLeft");
      if (el) el.textContent = fmtLeft(left);
      if (left <= 0 && !alarming) startAlarm();
    };
    step();
    tempTick = setInterval(step, 1000);
  }
  function startAlarm() {
    alarming = true;
    drawTemp();
    showAlarmBar();
    var ring = function () {
      beep(3);
      if (navigator.vibrate) { try { navigator.vibrate([300, 150, 300]); } catch (e) {} }
    };
    ring();
    alarmLoop = setInterval(ring, 4000);
  }
  function stopAlarm() {
    alarming = false;
    clearInterval(alarmLoop);
    var bar = $(".alarm-bar");
    if (bar) bar.remove();
  }
  function showAlarmBar() {
    if (!alarming || $(".alarm-bar")) return;
    var bar = document.createElement("div");
    bar.className = "alarm-bar";
    bar.innerHTML = "<span>🌡️ Đến giờ đo lại nhiệt độ cho bé</span>" +
      '<button class="btn" data-alarm-off>Đã biết</button>';
    view.insertBefore(bar, view.firstChild);
  }

  // ---- âm thanh ----
  var actx = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function beep(times) {
    if (!actx) return;
    try {
      for (var i = 0; i < times; i++) {
        var t = actx.currentTime + i * 0.35;
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + 0.27);
      }
    } catch (e) {}
  }

  // ---- giữ màn hình sáng khi đang đếm ----
  var lock = null;
  function wakeLock(on) {
    try {
      if (on && "wakeLock" in navigator && !lock) {
        navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
      } else if (!on && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }

  /* ============================================================
     Cài app lên màn hình chính
     ============================================================ */
  var deferredPrompt = null;
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredPrompt = e;
    var slot = $("#installSlot");
    if (slot) slot.outerHTML = installCard();
  });
  function installCard() {
    if (isStandalone || store.get("xltn-install-hide", false)) return "";
    var how;
    if (deferredPrompt) how = '<button class="btn primary" data-install>Cài app</button>';
    else if (isIOS) how = "";
    else how = "";
    var text = isIOS
      ? "Trong Safari, bấm nút <strong>Chia sẻ</strong> (ô vuông có mũi tên), rồi chọn <strong>Thêm vào MH chính</strong>."
      : deferredPrompt
        ? "Mở nhanh từ màn hình chính, dùng được cả khi mất mạng."
        : "Trong Chrome, mở menu <strong>⋮</strong> rồi chọn <strong>Thêm vào màn hình chính</strong>.";
    return '<div class="install" id="installSlot"><img class="install-icon" src="icons/icon-192.png" alt="" width="44" height="44"><div>' +
      "<strong>Cài lên màn hình điện thoại</strong><p>" + text + " Sau khi cài, app chạy được cả khi không có mạng.</p>" +
      '<div class="btns">' + how + '<button class="btn ghost" data-install-hide>Ẩn gợi ý này</button></div></div></div>';
  }

  /* ============================================================
     Bảng trượt xem nhanh kỹ năng
     ============================================================ */
  var sheet = $("#sheet"), lastFocus = null;
  function openSheet(id) {
    var k = SKILL[id];
    if (!k) return;
    if (sheet.hidden) lastFocus = document.activeElement;
    termSeen = {}; termSkip = -1;
    $("#sheetTitle").textContent = k.title;
    $("#sheetBody").innerHTML = renderItemBody(k) +
      '<a class="btn" style="width:100%" href="#/ky-nang/' + id + '" data-close-sheet>Mở trang riêng</a>';
    sheet.hidden = false;
    document.body.style.overflow = "hidden";
    $(".sheet-x").focus();
  }
  function openTerm(i) {
    var g = GLOSS[i];
    if (!g) return;
    if (sheet.hidden) lastFocus = document.activeElement;
    termSeen = {}; termSkip = i;
    $("#sheetTitle").textContent = g.term;
    $("#sheetBody").innerHTML = '<div class="term-card"><p>' + fmt(g.text) + "</p></div>" +
      '<a class="btn" style="width:100%" href="#/tu-ngu" data-close-sheet>Xem tất cả từ ngữ</a>';
    termSkip = -1;
    sheet.hidden = false;
    $("#sheetBody").scrollTop = 0;
    document.body.style.overflow = "hidden";
    $(".sheet-x").focus();
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ============================================================
     Điều hướng
     ============================================================ */
  var scrollMem = {};
  var curHash = null;
  var depth = 0;

  function setTitle(t) { $("#topTitle").textContent = t || ""; }

  function route() {
    var h = location.hash || "#/";
    if (curHash !== null) scrollMem[curHash] = window.scrollY;
    var parts = h.replace(/^#\/?/, "").split("/");
    var tab = "home";
    if (h === "#kham") return;
    closeSheet();
    setTitle("");
    termSeen = {}; termSkip = -1;
    if (!parts[0]) { pageHome(); }
    else if (parts[0] === "nhom") { pageCategory(parts[1]); }
    else if (parts[0] === "t") { pageSituation(parts[1]); }
    else if (parts[0] === "ky-nang") { tab = "skills"; parts[1] ? pageSkill(parts[1]) : pageSkills(); }
    else if (parts[0] === "tu-ngu") { tab = "skills"; pageGlossary(); }
    else if (parts[0] === "cong-cu") { tab = "tools"; pageTools(); }
    else if (parts[0] === "lich-trinh") { tab = "plan"; pagePlan(parts[1]); }
    else if (parts[0] === "cap-cuu") { tab = "sos"; pageEmergency(); }
    else notFound();

    var inner = !!parts[0] && ["ky-nang", "cong-cu", "cap-cuu", "lich-trinh"].indexOf(parts[0]) === -1 || (parts[0] === "ky-nang" && parts[1]);
    top.classList.toggle("inner", !!inner);
    $("#back").hidden = !inner;
    top.classList.remove("show-title");
    document.querySelectorAll(".tabs a").forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("data-tab") === tab);
      if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    curTab = tab;
    moveTabPill();
    document.title = ($("#topTitle").textContent ? $("#topTitle").textContent + " · " : "") + "Sunny time";

    view.classList.remove("page-enter", "page-push"); void view.offsetWidth;
    view.classList.add(inner ? "page-push" : "page-enter");
    showAlarmBar();
    var y = scrollMem[h] || 0;
    window.scrollTo(0, y);
    curHash = h;
    onScroll();
  }

  function onScroll() {
    var y = window.scrollY;
    top.classList.toggle("scrolled", y > 4);
    var h1 = $("#pageH1") || view.querySelector("h1");
    // tiêu đề lớn cuộn khuất thì hiện tiêu đề nhỏ ở thanh trên, như iOS
    top.classList.toggle("show-title", !!h1 && h1.getBoundingClientRect().bottom < 56);
  }

  // viên kính chạy theo tab đang chọn
  var curTab = "home";
  function moveTabPill() {
    var pill = $(".tab-pill"), a = $('.tabs a[data-tab="' + curTab + '"]');
    if (!pill || !a) return;
    var first = !pill.style.width;
    if (first) pill.style.transition = "none";   // lần đầu đặt thẳng vào chỗ, không trượt từ mép trái
    pill.style.width = a.offsetWidth + "px";
    pill.style.transform = "translateX(" + (a.offsetLeft - 5) + "px)";
    if (first) { void pill.offsetWidth; pill.style.transition = ""; }
    pill.classList.toggle("sos", curTab === "sos");
  }
  window.addEventListener("resize", moveTabPill);

  /* ============================================================
     Sự kiện chung
     ============================================================ */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var step = t.closest(".step");
    var term = t.closest("[data-term]");
    if (term) { e.preventDefault(); openTerm(+term.getAttribute("data-term")); return; }
    if (step && !t.closest(".ref")) { toggleStep(step); return; }
    var ref = t.closest("[data-skill]");
    if (ref) { e.preventDefault(); openSheet(ref.getAttribute("data-skill")); return; }
    if (t.closest("[data-close-sheet]")) {
      var a = t.closest("a[data-close-sheet]");
      closeSheet();
      if (!a) e.preventDefault();
      return;
    }
    if (t.closest("[data-reset]")) {
      var root = t.closest("[data-since]");
      var id = root.getAttribute("data-since");
      store.del(checkKey(id));
      var container = root.parentNode;
      container.querySelectorAll('.step[data-owner="' + id + '"]').forEach(function (s) {
        s.classList.remove("done"); s.setAttribute("aria-checked", "false");
      });
      container.querySelectorAll(".k-steps").forEach(function (b) { refreshProgress(b, id); });
      toast("Đã xoá các dấu đã làm");
      return;
    }
    var jump = t.closest("[data-jump]");
    if (jump) {
      e.preventDefault();
      var el = document.getElementById(jump.getAttribute("data-jump"));
      if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); }
      return;
    }
    var db = t.closest("[data-dob]");
    if (db) { e.preventDefault(); dobAction(db.getAttribute("data-dob")); return; }
    var mb = t.closest("[data-stage]");
    if (mb) { e.preventDefault(); if (!mb.disabled) drawPlan(mb.getAttribute("data-stage")); return; }
    var pv = t.closest("[data-pv]");
    if (pv) {
      planView = pv.getAttribute("data-pv"); store.set("xltn-plan-view", planView);
      drawPlan(store.get("xltn-plan-stage", "0a")); return;
    }
    if (t.closest("[data-clear]")) { lastQuery = ""; }
    if (t.closest("[data-install-hide]")) { store.set("xltn-install-hide", true); var c = $("#installSlot"); if (c) c.remove(); return; }
    if (t.closest("[data-install]") && deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () { deferredPrompt = null; var c = $("#installSlot"); if (c) c.remove(); });
      return;
    }
    if (t.closest("[data-alarm-off]")) { store.del("xltn-temp-end"); stopAlarm(); clearInterval(tempTick); drawTemp(); return; }
    if (t.closest("a[href^='#/']")) depth++;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
    if ((e.key === " " || e.key === "Enter") && e.target.classList && e.target.classList.contains("step")) {
      e.preventDefault(); toggleStep(e.target);
    }
  });
  $("#back").addEventListener("click", function () {
    if (depth > 0) { depth--; history.back(); }
    else location.hash = "#/";
  });
  window.addEventListener("hashchange", route);
  window.addEventListener("scroll", onScroll, { passive: true });

  // đổi sáng tối
  $("#themeBtn").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("xltn-theme", next); } catch (e) {}
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      m.setAttribute("content", next === "dark" ? "#000000" : "#F2F2F7");
    });
  });

  var toastT = 0;
  function toast(msg) {
    var el = $("#toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.hidden = true; }, 1800);
  }

  // vuốt xuống để đóng bảng trượt
  (function () {
    var y0 = null, panel = $(".sheet");
    panel.addEventListener("touchstart", function (e) {
      if ($("#sheetBody").scrollTop > 0) { y0 = null; return; }
      y0 = e.touches[0].clientY;
    }, { passive: true });
    panel.addEventListener("touchmove", function (e) {
      if (y0 == null) return;
      var dy = e.touches[0].clientY - y0;
      if (dy > 0) panel.style.transform = "translateY(" + dy + "px)";
    }, { passive: true });
    panel.addEventListener("touchend", function (e) {
      if (y0 == null) return;
      var dy = e.changedTouches[0].clientY - y0;
      panel.style.transform = "";
      y0 = null;
      if (dy > 90) closeSheet();
    });
  })();

  /* ============================================================
     Khởi động
     ============================================================ */
  buildIndex();
  route();
  checkTemp();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkTemp(); });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.addEventListener("updatefound", function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener("statechange", function () {
            if (w.state === "installed" && navigator.serviceWorker.controller) {
              toast("Đã có nội dung mới, mở lại app để cập nhật");
            }
          });
        });
      }).catch(function () {});
    });
  }
})();

</script>
</body>
</html>
