<text x="178" y="706" font-size="16" font-weight="700" fill="#1D2530">Thử cổ tay, xả khí</text>
<text x="178" y="730" font-size="13" font-weight="400" fill="#5B6573">Nhỏ ra cổ tay thấy ấm.</text>
<text x="178" y="750" font-size="13" font-weight="400" fill="#5B6573">Xả khí núm rồi cho bú.</text>
