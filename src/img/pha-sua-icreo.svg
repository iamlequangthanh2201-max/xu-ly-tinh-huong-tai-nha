<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 816" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="5 bước pha sữa Glico Icreo số 0">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3A7BD5"/></marker><marker id="arp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#EC6A9C"/></marker></defs>
<rect width="360" height="816" rx="20" fill="#fff"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#1D2530">Pha sữa Glico Icreo số 0</text>
<text text-anchor="end" x="342" y="34" font-size="13" font-weight="600" fill="#EC6A9C">0-12 tháng</text>
<circle cx="30" cy="76" r="13" fill="#EC6A9C"/><text text-anchor="middle" x="30" y="81" font-size="14" font-weight="700" fill="#fff">1</text>
<g><rect x="60" y="132" width="96" height="46" rx="8" fill="#E9EEF5" stroke="#5B6573" stroke-width="2"/><rect x="54" y="128" width="108" height="8" rx="4" fill="#5B6573"/><rect x="100" y="76" width="16" height="14" rx="7" fill="#F7C9DA" stroke="#EC6A9C" stroke-width="2"/><rect x="92" y="90" width="32" height="14" rx="3" fill="#EC6A9C"/><rect x="86" y="106" width="44" height="66" rx="10" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"/><line x1="118" y1="122" x2="128" y2="122" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="139" x2="128" y2="139" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="156" x2="128" y2="156" stroke="#3A7BD5" stroke-width="1.5"/><path d="M72 122 q-6 -10 0 -18 q6 -8 0 -18" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round"/><path d="M108 122 q-6 -10 0 -18 q6 -8 0 -18" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round"/><path d="M144 122 q-6 -10 0 -18 q6 -8 0 -18" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-linecap="round"/></g>
<text x="178" y="106" font-size="16" font-weight="700" fill="#1D2530">Rửa tay, tiệt trùng</text>
<text x="178" y="130" font-size="13" font-weight="400" fill="#5B6573">Rửa tay bằng xà phòng.</text>
<text x="178" y="150" font-size="13" font-weight="400" fill="#5B6573">Tiệt trùng bình và núm.</text>
<line x1="18" y1="202" x2="342" y2="202" stroke="#E6E9EE"/>
<circle cx="30" cy="226" r="13" fill="#EC6A9C"/><text text-anchor="middle" x="30" y="231" font-size="14" font-weight="700" fill="#fff">2</text>
<g><rect x="126" y="234" width="16" height="14" rx="7" fill="#F7C9DA" stroke="#EC6A9C" stroke-width="2"/><rect x="118" y="248" width="32" height="14" rx="3" fill="#EC6A9C"/><rect x="112" y="264" width="44" height="66" rx="10" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"/><line x1="144" y1="280" x2="154" y2="280" stroke="#3A7BD5" stroke-width="1.5"/><line x1="144" y1="297" x2="154" y2="297" stroke="#3A7BD5" stroke-width="1.5"/><line x1="144" y1="314" x2="154" y2="314" stroke="#3A7BD5" stroke-width="1.5"/><ellipse cx="82" cy="260" rx="22" ry="12" fill="#F3DFB8" stroke="#5B6573" stroke-width="2"/><rect x="100" y="256" width="34" height="7" rx="3.5" fill="#5B6573" transform="rotate(-20 100 260)"/><line x1="56" y1="248" x2="110" y2="248" stroke="#1D2530" stroke-width="3" stroke-linecap="round"/><path d="M82 280 q0 22 26 26" fill="none" stroke="#3A7BD5" stroke-width="2.5" marker-end="url(#ar)"/></g>
<text x="178" y="256" font-size="16" font-weight="700" fill="#1D2530">Lấy sữa, gạt ngang</text>
<text x="178" y="280" font-size="13" font-weight="400" fill="#5B6573">Dùng muỗng trong hộp,</text>
<text x="178" y="300" font-size="13" font-weight="400" fill="#5B6573">gạt phẳng. 1 muỗng = 20 ml.</text>
<line x1="18" y1="352" x2="342" y2="352" stroke="#E6E9EE"/>
<circle cx="30" cy="376" r="13" fill="#EC6A9C"/><text text-anchor="middle" x="30" y="381" font-size="14" font-weight="700" fill="#fff">3</text>
<g><rect x="128" y="384" width="16" height="14" rx="7" fill="#F7C9DA" stroke="#EC6A9C" stroke-width="2"/><rect x="120" y="398" width="32" height="14" rx="3" fill="#EC6A9C"/><rect x="114" y="414" width="44" height="66" rx="10" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"/><rect x="116" y="439.08" width="40" height="38.92" rx="8" fill="#BFE3FA"/><line x1="146" y1="430" x2="156" y2="430" stroke="#3A7BD5" stroke-width="1.5"/><line x1="146" y1="447" x2="156" y2="447" stroke="#3A7BD5" stroke-width="1.5"/><line x1="146" y1="464" x2="156" y2="464" stroke="#3A7BD5" stroke-width="1.5"/><path d="M58 392 h40 l8 22 h-56 z" fill="#DDE3EA" stroke="#5B6573" stroke-width="2"/><path d="M102 398 l18 -10" stroke="#5B6573" stroke-width="5" stroke-linecap="round"/><path d="M122 390 q4 20 0 34" fill="none" stroke="#7CC4F2" stroke-width="3" stroke-linecap="round"/><rect x="52" y="426" width="54" height="24" rx="12" fill="#FFE3D6"/><text x="58" y="443" font-size="14" font-weight="700" fill="#C2410C">&gt;70°C</text></g>
<text x="178" y="406" font-size="16" font-weight="700" fill="#1D2530">Rót 2/3 nước nóng</text>
<text x="178" y="430" font-size="13" font-weight="400" fill="#5B6573">Nước sôi để nguội còn trên</text>
<text x="178" y="450" font-size="13" font-weight="400" fill="#5B6573">70°C. Đậy nắp, lắc cho tan.</text>
<line x1="18" y1="502" x2="342" y2="502" stroke="#E6E9EE"/>
<circle cx="30" cy="526" r="13" fill="#EC6A9C"/><text text-anchor="middle" x="30" y="531" font-size="14" font-weight="700" fill="#fff">4</text>
<g><rect x="100" y="530" width="16" height="14" rx="7" fill="#F7C9DA" stroke="#EC6A9C" stroke-width="2"/><rect x="92" y="544" width="32" height="14" rx="3" fill="#EC6A9C"/><rect x="86" y="560" width="44" height="66" rx="10" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"/><rect x="88" y="563.3" width="40" height="60.699999999999996" rx="8" fill="#BFE3FA"/><line x1="118" y1="576" x2="128" y2="576" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="593" x2="128" y2="593" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="610" x2="128" y2="610" stroke="#3A7BD5" stroke-width="1.5"/><path d="M70 570 q-8 14 0 28" fill="none" stroke="#EC6A9C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arp)"/><path d="M146 570 q8 14 0 28" fill="none" stroke="#EC6A9C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arp)"/></g>
<text x="178" y="556" font-size="16" font-weight="700" fill="#1D2530">Thêm nước đến vạch</text>
<text x="178" y="580" font-size="13" font-weight="400" fill="#5B6573">Rót tiếp phần nước còn lại</text>
<text x="178" y="600" font-size="13" font-weight="400" fill="#5B6573">đến đúng vạch, lắc nhẹ.</text>
<line x1="18" y1="652" x2="342" y2="652" stroke="#E6E9EE"/>
<circle cx="30" cy="676" r="13" fill="#EC6A9C"/><text text-anchor="middle" x="30" y="681" font-size="14" font-weight="700" fill="#fff">5</text>
<g><rect x="100" y="672" width="16" height="14" rx="7" fill="#F7C9DA" stroke="#EC6A9C" stroke-width="2"/><rect x="92" y="686" width="32" height="14" rx="3" fill="#EC6A9C"/><rect x="86" y="702" width="44" height="66" rx="10" fill="#fff" stroke="#3A7BD5" stroke-width="2.5"/><rect x="88" y="705.3" width="40" height="60.699999999999996" rx="8" fill="#BFE3FA"/><line x1="118" y1="718" x2="128" y2="718" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="735" x2="128" y2="735" stroke="#3A7BD5" stroke-width="1.5"/><line x1="118" y1="752" x2="128" y2="752" stroke="#3A7BD5" stroke-width="1.5"/><path d="M56 736 h104 l-10 40 h-84 z" fill="#D6ECFB" stroke="#3A7BD5" stroke-width="2"/><path d="M64 750 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#fff" stroke-width="2"/><rect x="134" y="690" width="30" height="22" rx="11" fill="#E3F6E9"/><text x="136" y="706" font-size="13" font-weight="700" fill="#1F8A3D">37°</text></g>
<text x="178" y="706" font-size="16" font-weight="700" fill="#1D2530">Làm nguội 37-38°C</text>
<text x="178" y="730" font-size="13" font-weight="400" fill="#5B6573">Ngâm bình vào nước lạnh,</text>
<text x="178" y="750" font-size="13" font-weight="400" fill="#5B6573">nhỏ thử cổ tay thấy ấm.</text>
</svg>