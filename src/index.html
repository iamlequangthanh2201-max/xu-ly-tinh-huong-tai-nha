<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="Sunny time: lịch trình trong ngày theo tháng tuổi và các bước xử lý tại nhà khi bé hoặc mẹ gặp vấn đề sau sinh.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunny time">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    var t = localStorage.getItem("xltn-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
      // thanh trạng thái theo đúng giao diện đã chọn
      var c = t === "dark" ? "#000000" : "#F2F2F7";
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", c); });
    }
  } catch (e) {}
</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <button class="glass-btn top-back" id="back" aria-label="Quay lại" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <a class="brand" href="#/" id="brand">
    <img class="brand-mark" src="icons/mark.png" alt="" width="30" height="30">
    <span class="brand-name">Sunny time</span>
  </a>
  <span class="top-title" id="topTitle"></span>
  <button class="glass-btn theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng tối">
    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Điều hướng chính">
  <span class="tab-pill" aria-hidden="true"></span>
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.6 15.6l4.6 4.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>Tra cứu</span>
  </a>
  <a href="#/lich-trinh" data-tab="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor"/><circle cx="12" cy="14.5" r="1.3" fill="currentColor"/></svg>
    <span>Lịch trình</span>
  </a>
  <a href="#/ky-nang" data-tab="skills">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8h10a2 2 0 0 1 2 2v14.4l-7-3.6-7 3.6V5.8a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
    <span>Kỹ năng</span>
  </a>
  <a href="#/cong-cu" data-tab="tools">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.3" r="7.4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 9.3v4.2l2.6 1.6M9.5 2.8h5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
    <span>Công cụ</span>
  </a>
  <a href="#/cap-cuu" data-tab="sos" class="tab-sos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 3.5h5.4v5.8h5.8v5.4h-5.8v5.8H9.3v-5.8H3.5V9.3h5.8z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
    <span>Cấp cứu</span>
  </a>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-scrim" data-close-sheet></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="glass-btn sheet-x" data-close-sheet aria-label="Đóng">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
window.APP_VERSION = "__VERSION__";
/*__JS__*/
</script>
</body>
</html>
